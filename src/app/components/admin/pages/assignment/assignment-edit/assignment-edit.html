<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Edit Assignment</h1>
      <p class="text-gray-600 mt-1">Update assignment details</p>
    </div>
    <a
      routerLink="/admin/assignment/list"
      class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors flex items-center space-x-2 text-sm font-medium"
    >
      <i class="fas fa-arrow-left"></i>
      <span>Back</span>
    </a>
  </div>
</div>

<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading assignment details...</p>
</div>

<div *ngIf="!isLoading" class="space-y-6 bg-white rounded-lg border border-gray-200 p-6">
  <form [formGroup]="assignmentForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Course -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2"
        >Course <span class="text-red-500">*</span></label
      >
      <select
        formControlName="course_id"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
      >
        <option value="" disabled>Select Course</option>
        <option *ngFor="let course of courses" [value]="course.id">{{ course.course_name }}</option>
      </select>
    </div>

    <!-- Title -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2"
        >Title <span class="text-red-500">*</span></label
      >
      <input
        type="text"
        formControlName="title"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        placeholder="Enter assignment title"
      />
    </div>
    <!-- Start Date -->
<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
  <input
    type="date"
    class="form-input w-full"
    formControlName="start_date"
  />
</div>

    <!-- Due Date -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2"
        >Due Date <span class="text-red-500">*</span></label
      >
      <input
        type="date"
        formControlName="due_date"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Total Marks -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Total Marks</label>
      <input
        type="number"
        formControlName="total_marks"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        placeholder="e.g. 100"
      />
    </div>


    <!-- Description -->
<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
  <ckeditor
    [editor]="Editor"
    [config]="editorConfig"
    formControlName="description"
  ></ckeditor>
</div>




    <!-- Existing File & Upload -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Assignment File</label>

      <!-- Show existing file -->
      <div *ngIf="existingFile; else noFile" class="mb-2 text-blue-600">
        <a [href]="'/assets/assignment_files/' + existingFile" target="_blank">
          {{ existingFile }}
        </a>
      </div>
      <ng-template #noFile>
        <span class="text-gray-500 text-sm">No file uploaded</span>
      </ng-template>

      <!-- Upload new file -->
      <input
        type="file"
        (change)="onFileSelected($event)"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
      />
    </div>

    
<!-- Active Status -->
<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
  <select
    class="form-select w-full"
    formControlName="active_status"
  >
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>
</div>

    <!-- Buttons -->
    <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
      <button
        type="button"
        (click)="cancel()"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700"
        [disabled]="isSubmitting"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="assignmentForm.invalid || isSubmitting"
        class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium flex items-center space-x-2"
      >
        <i *ngIf="isSubmitting" class="fas fa-spinner fa-spin"></i>
        <span>{{ isSubmitting ? 'Updating...' : 'Update Assignment' }}</span>
      </button>
    </div>
  </form>
</div>
