<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Add Assignment</h1>
      <p class="text-gray-600 mt-1">Create a new assignment</p>
    </div>
    <a
      routerLink="/admin/assignment/list"
      class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 flex items-center space-x-2 text-sm font-medium"
    >
      <i class="fas fa-arrow-left"></i> <span>Back</span>
    </a>
  </div>
</div>

<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-600 mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading courses...</p>
</div>

<div *ngIf="!isLoading" class="space-y-6 bg-white rounded-lg border border-gray-200 p-6">
  <form [formGroup]="assignmentForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Course -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-2">
    Course <span class="text-red-500">*</span>
  </label>
  <select formControlName="course_id" (change)="onCourseChange()"
    class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500">
    <option value="" disabled selected hidden>Select Course</option>
    <option *ngFor="let course of courses" [value]="course.id">{{ course.course_name }}</option>
  </select>
</div>

<!-- ✅ Batch -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-2">
    Batch <span class="text-red-500">*</span>
  </label>
  <div *ngIf="loadingBatches" class="text-sm text-gray-500">
    <i class="fas fa-spinner fa-spin mr-1"></i> Loading batches...
  </div>
  <select *ngIf="!loadingBatches" formControlName="batch_id"
    class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500">
    <option value="" disabled selected hidden>Select Batch</option>
    <option *ngFor="let batch of batches" [value]="batch.id">{{ batch.name }}</option>
  </select>
  <p *ngIf="!loadingBatches && batches.length === 0 && f['course_id'].value"
    class="text-sm text-gray-400 mt-1">No batches found for this course.</p>
</div>
    <!-- Title -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Title <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="title"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
        placeholder="Enter assignment title"
      />
    </div>

    <!-- Assignment File -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Assignment File</label>
      <input
        type="file"
        (change)="onFileSelected($event)"
        accept=".pdf,.doc,.docx,.ppt,.pptx"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm"
      />
      <p class="text-xs text-gray-500 mt-1">Allowed files: PDF, DOC, DOCX, PPT</p>
    </div>

    <div class="md:col-span-2 mt-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Upload Date</label>
      <input
        formControlName="start_date"
        type="date"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
      />
    </div>

    <!-- Due Date -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Due Date</label>
      <input
        type="date"
        formControlName="due_date"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
      />
    </div>

    <!-- Total Marks -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Total Marks</label>
      <input
        type="number"
        formControlName="total_marks"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
        placeholder="e.g. 100"
      />
    </div>

    <!-- Assignment Description -->
    <div class="md:col-span-2 mt-4">
      <label class="block text-sm font-medium text-gray-700 mb-2"> Assignment Description </label>

      <div class="w-full rounded-lg border border-gray-300 overflow-hidden">
        <ckeditor
          [editor]="Editor"
          [config]="editorConfig"
          formControlName="description"
          class="w-full"
        ></ckeditor>
      </div>

      <!-- Optional helper / validation message -->
      <div
        *ngIf="f['description'].invalid && f['description'].touched"
        class="text-red-500 mt-1 text-sm"
      >
        Description is required.
      </div>
    </div>

    <!-- Old Quill Editor  -->
    <!--
<quill-editor
  formControlName="description"
  [style]="{ height: '200px' }"
  [modules]="quillModules"
  placeholder="Enter assignment description"
>
</quill-editor>
-->

    <div class="md:col-span-2 mt-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Active Status</label>
      <select
        formControlName="active_status"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
      >
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <!-- Submit Buttons -->
    <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
      <button
        type="button"
        (click)="cancel()"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50"
      >
        <i class="fas fa-times"></i> Cancel
      </button>
      <button
        type="submit"
        [disabled]="assignmentForm.invalid || isSubmitting"
        class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 text-sm font-medium flex items-center space-x-2"
      >
        <i *ngIf="!isSubmitting" class="fas fa-save"></i>
        <span
          *ngIf="isSubmitting"
          class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"
        ></span>
        <span>{{ isSubmitting ? 'Saving...' : 'Create Assignment' }}</span>
      </button>
    </div>
  </form>
</div>
