<div class="p-6 max-w-3xl mx-auto">

  <!-- Loading -->
  <div *ngIf="loading" class="flex justify-center py-20">
    <div class="animate-spin rounded-full h-10 w-10 border-4 border-gray-200 border-t-[#073a89]"></div>
  </div>

  <div *ngIf="!loading">
    <!-- Header -->
    <div class="flex items-center gap-4 mb-8">
      <a routerLink="/admin/announcement/list"
        class="w-9 h-9 flex items-center justify-center rounded-lg border border-gray-200 hover:bg-gray-50 transition-all text-gray-500">
        <i class="fas fa-arrow-left text-sm"></i>
      </a>
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Edit Announcement</h1>
        <p class="text-gray-500 text-sm">Update announcement details</p>
      </div>
    </div>

    <!-- Already Sent Notice -->
    <div *ngIf="alreadySent" class="mb-5 p-4 bg-blue-50 border border-blue-200 rounded-xl text-blue-700 text-sm flex items-center gap-2">
      <i class="fas fa-info-circle"></i>
      This announcement has already been sent. Changing status to <strong>Send Now</strong> again will <strong>not</strong> resend emails.
    </div>

    <!-- Success -->
    <div *ngIf="successMsg" class="mb-5 p-4 bg-green-50 border border-green-200 rounded-xl text-green-700 text-sm font-medium flex items-center gap-2">
      <i class="fas fa-check-circle"></i> {{ successMsg }}
    </div>

    <!-- Error -->
    <div *ngIf="errorMsg" class="mb-5 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm font-medium flex items-center gap-2">
      <i class="fas fa-exclamation-circle"></i> {{ errorMsg }}
    </div>

    <!-- Form -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 space-y-6">

      <!-- Title -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Title <span class="text-red-500">*</span>
        </label>
        <input
          [(ngModel)]="form.title"
          type="text"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all"
        />
      </div>

      <!-- Message -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Message <span class="text-red-500">*</span>
        </label>
        <textarea
          [(ngModel)]="form.message"
          rows="6"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all resize-none"
        ></textarea>
      </div>

      <!-- Priority + Status -->
      <div class="grid md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Priority</label>
          <select
            [(ngModel)]="form.priority"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all bg-white">
            <option value="low">🟢 Low</option>
            <option value="normal">🟡 Normal</option>
            <option value="high">🔴 High</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
          <select
            [(ngModel)]="form.status"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all bg-white">
            <option value="draft">📝 Draft</option>
            <option value="sent">📤 Send Now</option>
            <option value="scheduled">🕐 Scheduled</option>
          </select>
        </div>
      </div>

      <!-- Scheduled At -->
      <div *ngIf="form.status === 'scheduled'">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Schedule Date & Time</label>
        <input
          [(ngModel)]="form.scheduled_at"
          type="datetime-local"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all"
        />
      </div>

      <!-- Send Warning -->
      <div *ngIf="form.status === 'sent' && !alreadySent" class="p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-700 text-sm flex items-start gap-2">
        <i class="fas fa-info-circle mt-0.5 shrink-0"></i>
        <span>Selecting <strong>Send Now</strong> will send emails to all registered users.</span>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <a routerLink="/admin/announcement/list"
          class="px-5 py-2.5 border border-gray-200 text-gray-600 rounded-xl font-semibold text-sm hover:bg-gray-50 transition-all">
          Cancel
        </a>
        <button
          (click)="submit()"
          [disabled]="submitting"
          class="px-6 py-2.5 bg-[#073a89] text-white rounded-xl font-semibold text-sm hover:bg-blue-900 transition-all disabled:opacity-60 flex items-center gap-2">
          <i *ngIf="submitting" class="fas fa-spinner fa-spin"></i>
          <i *ngIf="!submitting" class="fas fa-save"></i>
          {{ submitting ? 'Saving...' : 'Update Announcement' }}
        </button>
      </div>

    </div>
  </div>
</div>
