<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12">

  <!-- Toast Notification -->
  <div *ngIf="toast.show"
    [ngClass]="{
      'bg-green-50 border-green-400 text-green-800': toast.type === 'success',
      'bg-red-50 border-red-400 text-red-800': toast.type === 'error'
    }"
    class="fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-4 rounded-xl border shadow-lg text-sm font-medium transition-all duration-300 max-w-sm">
    <span *ngIf="toast.type === 'success'" class="text-green-500">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </span>
    <span *ngIf="toast.type === 'error'" class="text-red-500">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </span>
    <span>{{ toast.message }}</span>
  </div>

  <!-- Card -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-8 py-7 text-white">
      <div class="flex items-center gap-3 mb-2">
        <div class="bg-white/20 rounded-full p-2">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h1 class="text-xl font-semibold">Reset Password</h1>
      </div>
      <p class="text-blue-100 text-sm">Enter your new password below to update your account.</p>
    </div>

    <!-- Form Body -->
    <div class="px-8 py-7 space-y-5">

      <!-- New Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
        <div class="relative">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            [(ngModel)]="newPassword"
            placeholder="Enter new password"
            class="w-full pl-4 pr-11 py-3 rounded-xl border border-gray-200 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            [ngClass]="{'border-red-400 focus:ring-red-400': errors.newPassword}"
          />
          <button type="button" (click)="showNewPassword = !showNewPassword"
            class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600">
            <svg *ngIf="!showNewPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showNewPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
        <p *ngIf="errors.newPassword" class="text-xs text-red-500 mt-1">{{ errors.newPassword }}</p>

        <!-- Password Strength Bar -->
        <div *ngIf="newPassword" class="mt-2">
          <div class="flex gap-1 mb-1">
            <div class="h-1 flex-1 rounded-full transition-all duration-300"
              [ngClass]="passwordStrength >= 1 ? strengthColors[passwordStrength - 1] : 'bg-gray-200'"></div>
            <div class="h-1 flex-1 rounded-full transition-all duration-300"
              [ngClass]="passwordStrength >= 2 ? strengthColors[passwordStrength - 1] : 'bg-gray-200'"></div>
            <div class="h-1 flex-1 rounded-full transition-all duration-300"
              [ngClass]="passwordStrength >= 3 ? strengthColors[passwordStrength - 1] : 'bg-gray-200'"></div>
            <div class="h-1 flex-1 rounded-full transition-all duration-300"
              [ngClass]="passwordStrength >= 4 ? strengthColors[passwordStrength - 1] : 'bg-gray-200'"></div>
          </div>
          <p class="text-xs" [ngClass]="strengthTextColors[passwordStrength - 1]">{{ strengthLabel }}</p>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
        <div class="relative">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter new password"
            class="w-full pl-4 pr-11 py-3 rounded-xl border border-gray-200 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            [ngClass]="{'border-red-400 focus:ring-red-400': errors.confirmPassword}"
          />
          <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
            class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600">
            <svg *ngIf="!showConfirmPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showConfirmPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
        <p *ngIf="errors.confirmPassword" class="text-xs text-red-500 mt-1">{{ errors.confirmPassword }}</p>

        <!-- Match indicator -->
        <div *ngIf="confirmPassword && newPassword" class="flex items-center gap-1.5 mt-1.5">
          <svg *ngIf="newPassword === confirmPassword" class="w-3.5 h-3.5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          <svg *ngIf="newPassword !== confirmPassword" class="w-3.5 h-3.5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
          <span class="text-xs" [ngClass]="newPassword === confirmPassword ? 'text-green-600' : 'text-red-400'">
            {{ newPassword === confirmPassword ? 'Passwords match' : 'Passwords do not match' }}
          </span>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        (click)="onResetPassword()"
        [disabled]="loading"
        class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white text-sm font-semibold py-3 rounded-xl transition-all duration-200 mt-2">

        <!-- Loader Spinner -->
        <svg *ngIf="loading" class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>

        <span>{{ loading ? 'Updating Password...' : 'Reset Password' }}</span>
      </button>

      <!-- Back Link -->
      <div class="text-center">
        <button (click)="goBack()" class="text-sm text-gray-500 hover:text-blue-600 transition-colors duration-200">
          ← Back to Profile
        </button>
      </div>

    </div>
  </div>
</div>
