<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Add Course Curriculum</h1>
      <p class="text-gray-600 mt-1">Create new course curriculum</p>
    </div>
    <a
      routerLink="/admin/course/curriculum/list"
      class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 flex items-center space-x-2 text-sm font-medium"
    >
      <i class="fas fa-arrow-left"></i> <span>Back</span>
    </a>
  </div>
</div>

<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-600 mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading courses...</p>
</div>

<div *ngIf="!isLoading" class="bg-white rounded-lg border border-gray-200 p-6">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Course Name <span class="text-red-500">*</span>
      </label>
      <select
        formControlName="course_id"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
      >
        <option value="" disabled selected hidden>Select Course</option>
        <option *ngFor="let course of courses" [value]="course.id">
          {{ course.course_name }}
        </option>
      </select>
    </div>

    <hr class="border-gray-200" />

    <div formArrayName="items" class="space-y-8">
      <div
        *ngFor="let item of items.controls; let i = index"
        [formGroupName]="i"
        class="relative pb-8 border-b border-gray-100 last:border-0"
      >
        <div class="flex justify-end mb-2">
          <button
            type="button"
            *ngIf="items.length > 1"
            (click)="removeItem(i)"
            class="text-red-500 hover:text-red-700 text-xs flex items-center gap-1 font-medium"
          >
            <i class="fas fa-trash"></i> Remove Item
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Course Title <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              formControlName="title"
              class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
              placeholder="Enter curriculum title"
            />
          </div>

        <div>
  <div class="flex justify-between items-center mb-2">
    <label class="block text-sm font-medium text-gray-700">Duration (Weeks)</label>
    <span *ngIf="item.get('duration')?.value" class="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded border border-orange-100">
      Week: {{ item.get('duration')?.value }}
    </span>
  </div>
  <!-- ✅ Type "number" se "text" mein change karo -->
  <input
    type="text"
    formControlName="duration"
    class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
    placeholder="e.g., 2, 2-4, 3-5 weeks"
  />
</div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
          <quill-editor
            formControlName="description"
            [styles]="{ height: '130px' }"
            [modules]="quillModules"
            placeholder="Optional description"
            class="w-full bg-gray-50 border border-gray-300 rounded-lg"
          ></quill-editor>
        </div>
      </div>
    </div>

    <div class="pt-4">
      <button
        type="button"
        (click)="addItem()"
        class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 text-sm font-medium flex items-center gap-2 transition-colors"
      >
        <i class="fas fa-plus"></i>
        <span>Add More </span>
      </button>
    </div>

    <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
      <button type="button" (click)="cancel()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="!canSave || isSubmitting"
        class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 text-sm font-medium flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="isSubmitting" class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
        <span>{{ isSubmitting ? 'Saving...' : 'Save Curriculum' }}</span>
      </button>
    </div>
  </form>
</div>
