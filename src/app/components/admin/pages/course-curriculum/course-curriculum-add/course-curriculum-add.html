<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Add Course Curriculum</h1>
      <p class="text-gray-600 mt-1">Create new course curriculum</p>
    </div>
    <a
      routerLink="/admin/course-curriculum/list"
      class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 flex items-center space-x-2 text-sm font-medium"
    >
      <i class="fas fa-arrow-left"></i> <span>Back</span>
    </a>
  </div>
</div>

<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading courses...</p>
</div>

<div *ngIf="!isLoading" class="space-y-6 bg-white rounded-lg border border-gray-200 p-6">
  <form [formGroup]="curriculumForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Course <span class="text-red-500">*</span>
      </label>
      <select
        formControlName="course_id"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
      >
        <option value="" disabled selected hidden>Select Course</option>
        <option *ngFor="let course of courses" [value]="course.id">
          {{ course.course_name }}
        </option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Title <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="title"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        placeholder="Enter curriculum title"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Type <span class="text-red-500">*</span>
      </label>
      <select
        formControlName="type"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
      >
        <option value="" disabled hidden>Select type</option>
        <option value="video">Video</option>
        <option value="reading">Reading</option>
        <option value="assignment">Assignment</option>
      </select>
    </div>

    <!-- Reading / Assignment → File Upload -->
    <div
      *ngIf="
        curriculumForm.get('type')?.value === 'reading' ||
        curriculumForm.get('type')?.value === 'assignment'
      "
    >
      <label class="block text-sm font-medium text-gray-700 mb-2">Documents</label>
      <input
        type="file"
        (change)="onFileSelected($event)"
        accept=".pdf,.doc,.docx,.ppt,.pptx"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm"
      />
      <p class="text-xs text-gray-500 mt-1">Allowed files: PDF, DOC, DOCX, PPT</p>
    </div>

    <!-- Video → URL Input -->
    <div *ngIf="curriculumForm.get('type')?.value === 'video'">
      <label class="block text-sm font-medium text-gray-700 mb-2">Video URL</label>
      <input
        type="text"
        formControlName="documents"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm"
        placeholder="Enter video URL"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Duration (minutes)</label>
      <input
        type="number"
        formControlName="duration"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm"
        placeholder="e.g. 30"
      />
    </div>
<!-- description  -->
   <div>
  <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>

  <!-- ✅ CKEditor -->
  <div class="w-full rounded-lg border border-gray-300 overflow-hidden">
    <ckeditor
      [editor]="Editor"
      [config]="editorConfig"
      formControlName="description"
      class="w-full"
    ></ckeditor>
  </div>

  <!-- ❌ Quill (commented out) -->
  <!--
  <quill-editor
    formControlName="description"
    [styles]="{ height: '150px' }"
    [modules]="quillModules"
    placeholder="Optional description"
    class="w-full bg-gray-50 border border-gray-300 rounded-lg"
  >
  </quill-editor>
  -->
</div>

    <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
      <button
        type="button"
        (click)="cancel()"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50"
      >
        <i class="fas fa-times"></i> Cancel
      </button>
      <button
        type="submit"
        [disabled]="curriculumForm.invalid || isSubmitting"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm font-medium flex items-center space-x-2"
      >
        <i *ngIf="!isSubmitting" class="fas fa-save"></i>
        <span
          *ngIf="isSubmitting"
          class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"
        ></span>
        <span>{{ isSubmitting ? 'Creating...' : 'Create Curriculum' }}</span>
      </button>
    </div>
  </form>
</div>
