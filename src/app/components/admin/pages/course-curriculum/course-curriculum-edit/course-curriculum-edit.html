<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Edit Course Curriculum</h1>
      <p class="text-gray-600 mt-1">Update course curriculum details</p>
    </div>
    <a
      routerLink="/admin/course-curriculum/list"
      class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 flex items-center space-x-2 text-sm font-medium transition-colors"
    >
      <i class="fas fa-arrow-left"></i> <span>Back</span>
    </a>
  </div>
</div>

<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-600 mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading curriculum details...</p>
</div>

<div *ngIf="!isLoading" class="bg-white rounded-lg border border-gray-200 p-6">
  <form [formGroup]="curriculumForm" (ngSubmit)="onSubmit()" class="space-y-6">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Course Name <span class="text-red-500">*</span>
      </label>
      <select
        formControlName="course_id"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
      >
        <option value="" disabled selected hidden>Select Course</option>
        <option *ngFor="let course of courses" [value]="course.id">
          {{ course.course_name }}
        </option>
      </select>
    </div>

    <hr class="border-gray-200" />

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Course Title <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="title"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
          placeholder="Enter curriculum title"
        />
      </div>

    <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-sm font-medium text-gray-700">Duration (Weeks)</label>
          <span *ngIf="curriculumForm.get('duration')?.value" class="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded border border-orange-100">
            Week: {{ curriculumForm.get('duration')?.value }}
          </span>
        </div>
        <!-- ✅ Change type from "number" to "text" -->
        <input
          type="text"
          formControlName="duration"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
          placeholder="e.g., 2, 2-4, 3-5 weeks"
        />
      </div>
  
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
      <quill-editor
        formControlName="description"
        [styles]="{ height: '150px' }"
        [modules]="quillModules"
        placeholder="Optional description"
        class="w-full bg-gray-50 border border-gray-300 rounded-lg"
      >
      </quill-editor>
    </div>

    <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
      <button
        type="button"
        (click)="cancel()"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
        [disabled]="isSubmitting"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="curriculumForm.invalid || isSubmitting"
        class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 text-sm font-medium flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      >
        <i *ngIf="!isSubmitting" class="fas fa-save"></i>
        <i *ngIf="isSubmitting" class="fas fa-spinner fa-spin"></i>
        <span>{{ isSubmitting ? 'Updating...' : 'Update Curriculum' }}</span>
      </button>
    </div>
  </form>
</div>
