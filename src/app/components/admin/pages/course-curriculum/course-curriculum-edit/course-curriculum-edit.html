<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Edit Curriculum</h1>
      <p class="text-gray-600 mt-1">Update course curriculum details</p>
    </div>
    <a
      routerLink="/admin/course-curriculum/list"
      class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors flex items-center space-x-2 text-sm font-medium"
    >
      <i class="fas fa-arrow-left"></i>
      <span>Back</span>
    </a>
  </div>
</div>

<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading curriculum details...</p>
</div>

<div *ngIf="!isLoading" class="space-y-6">
  <div class="bg-white rounded-lg border border-gray-200 p-6">
    <form [formGroup]="curriculumForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Course Select -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Course <span class="text-red-500">*</span>
        </label>
        <select
          formControlName="course_id"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Select Course</option>
          <option *ngFor="let course of courses" [value]="course.id">
            {{ course.course_name }}
          </option>
        </select>
      </div>

      <!-- Title -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Title <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="title"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
          placeholder="Enter curriculum title"
        />
      </div>

      <!-- Type -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Type <span class="text-red-500">*</span>
        </label>
        <select
          formControlName="type"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Select Type</option>
          <option value="video">Video</option>
          <option value="reading">Reading</option>
          <option value="assignment">Assignment</option>
          <option value="lecture">Lecture</option>
        </select>
      </div>

      <!-- Video URL -->
      <div *ngIf="curriculumForm.get('type')?.value === 'video'">
        <label class="block text-sm font-medium text-gray-700 mb-2">Video URL</label>
        <input
          type="text"
          formControlName="video_url"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm"
          placeholder="Enter video URL"
        />
      </div>

      <!-- Documents (Reading / Assignment) -->
      <div
        *ngIf="
          curriculumForm.get('type')?.value === 'reading' ||
          curriculumForm.get('type')?.value === 'assignment'
        "
      >
        <label class="block text-sm font-medium text-gray-700 mb-2">Documents</label>

        <!-- Existing document link -->
        <div *ngIf="existingDocument; else noDoc" class="mb-2 text-blue-600">
          <a [href]="'/assets/course_documents/' + existingDocument" target="_blank">
            {{ existingDocument }}
          </a>
        </div>
        <ng-template #noDoc>
          <span class="text-gray-500 text-sm">No document uploaded</span>
        </ng-template>

        <!-- Upload new document -->
        <input
          type="file"
          (change)="onFileSelected($event)"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Duration -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Duration (minutes)</label>
        <input
          type="number"
          formControlName="duration"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm"
        />
      </div>

  <!-- Description -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>

  <!-- ✅ CKEditor -->
  <div class="w-full rounded-lg border border-gray-300 overflow-hidden">
    <ckeditor
      [editor]="Editor"
      [config]="editorConfig"
      formControlName="description"
      class="w-full"
    ></ckeditor>
  </div>

  <!-- ❌ Quill (commented out) -->
  <!--
  <quill-editor
    formControlName="description"
    [styles]="{ height: '150px' }"
    [modules]="quillModules"
    placeholder="Optional description"
    class="w-full bg-gray-50 border border-gray-300 rounded-lg"
  >
  </quill-editor>
  -->
</div>
      <!-- Buttons -->
      <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
        <button
          type="button"
          (click)="cancel()"
          class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700"
          [disabled]="isSubmitting"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="curriculumForm.invalid || isSubmitting"
          class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium flex items-center space-x-2"
        >
          <i *ngIf="isSubmitting" class="fas fa-spinner fa-spin"></i>
          <span>{{ isSubmitting ? 'Updating...' : 'Update Curriculum' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
