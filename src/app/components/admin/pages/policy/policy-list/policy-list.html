<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
        <div class="flex flex-col md:flex-row md:justify-between md:items-center space-y-4 md:space-y-0">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Policy Management</h1>
                <p class="text-gray-600 mt-1">Manage Policy Pages</p>
            </div>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center space-y-2 sm:space-y-0 sm:space-x-2">
                <button
                    (click)="refreshData()"
                    [disabled]="isLoading"
                    class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors flex items-center justify-center space-x-2 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <i class="fas fa-sync-alt" [class.animate-spin]="isLoading"></i>
                    <span>{{ isLoading ? 'Refreshing...' : 'Refresh' }}</span>
                </button>
                <a
                 *ngIf="can('create_policies')"
                    routerLink="/admin/policy/add"
                    class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 transition-colors flex items-center justify-center space-x-2 text-sm font-medium"
                >
                    <i class="fas fa-plus"></i>
                    <span>Add New Policy</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center mb-6">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-600 mx-auto"></div>
        <p class="text-gray-500 mt-2">Loading Policies...</p>
    </div>

    <!-- Filters - Show only when not loading -->
    <div *ngIf="!isLoading" class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
        <div class="relative">
            <div class="flex items-center bg-gray-100 rounded-lg px-3 py-2 w-full">
                <i class="fas fa-search text-gray-400 mr-2"></i>
                <input
                    type="text"
                    [(ngModel)]="searchTerm"
                    (ngModelChange)="onSearch()"
                    placeholder="Search Policies..."
                    class="bg-transparent border-none focus:outline-none focus:ring-0 w-full text-sm"
                >
            </div>
        </div>
    </div>

    <!-- Main Content - Show only when not loading -->
    <div *ngIf="!isLoading">
        <!-- No Data -->
        <div *ngIf="policies.length === 0" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-question-circle text-gray-400 text-2xl"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">No Policies Found</h3>
            <p class="text-gray-600 mb-4">Start by adding your first policy</p>

        </div>

        <!-- Data Table -->
        <div *ngIf="policies.length > 0" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
            <!-- Mobile Card View (Hidden on medium screens and up) -->
            <div class="md:hidden divide-y divide-gray-200">
                <div *ngFor="let policy of policies; trackBy: trackById" class="p-4 hover:bg-gray-50">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-sm font-medium text-gray-500">#{{policy.id}}</span>
                        <div class="flex space-x-2">
                              <a
    *ngIf="can('edit_policies')"
    routerLink="/admin/policy/edit/{{policy.id}}"
    class="px-3 py-1 bg-orange-100 text-orange-700 rounded hover:bg-orange-200 text-xs font-medium transition-colors"
  >
    Edit
  </a>
  
  <!-- Delete Button - Sirf delete_policies permission ho to dikhe -->
  <button
    *ngIf="can('delete_policies')"
    (click)="deletePolicy(policy.id)"
    class="px-3 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 text-xs font-medium transition-colors"
  >
    Delete
  </button>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Title</h4>
                            <p class="text-sm font-medium text-gray-900 break-words">{{policy.title}}</p>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Desktop Table View (Hidden on mobile, shown on medium screens and up) -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr *ngFor="let policy of policies; trackBy: trackById" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">#{{policy.id}}</td>
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{policy.title}}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                <div class="flex space-x-2">
                                      <a
    *ngIf="can('edit_policies')"
    routerLink="/admin/policy/edit/{{policy.id}}"
    class="px-3 py-1 bg-orange-100 text-orange-700 rounded hover:bg-orange-200 text-xs font-medium transition-colors"
  >
    Edit
  </a>
  
 
  <button
    *ngIf="can('delete_policies')"
    (click)="deletePolicy(policy.id)"
    class="px-3 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 text-xs font-medium transition-colors"
  >
    Delete
  </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="border-t border-gray-200 px-6 py-4 bg-gray-50">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center space-y-2 sm:space-y-0">
                    <div class="text-sm text-gray-700 text-center sm:text-left">
                        Showing {{policies.length}} of {{totalItems}} policies
                    </div>
                    <button
                        (click)="refreshData()"
                        [disabled]="isLoading"
                        class="text-sm text-orange-600 hover:text-orange-800 font-medium flex items-center justify-center sm:justify-start disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <i class="fas fa-sync-alt mr-2" [class.animate-spin]="isLoading"></i>
                        {{ isLoading ? 'Refreshing...' : 'Refresh List' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
