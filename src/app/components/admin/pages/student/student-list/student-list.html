<div class="container mx-auto px-4 py-8">
  <!-- Header -->
  <div class="bg-white rounded-lg border border-gray-200 p-6 mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Student Management</h1>
      <p class="text-gray-600 mt-1">Manage students and their details</p>
    </div>
    <div class="flex space-x-2">
      <button (click)="refreshData()" [disabled]="isLoading" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm font-medium">
        <i class="fas fa-sync-alt mr-2" [class.animate-spin]="isLoading"></i>
        {{ isLoading ? 'Refreshing...' : 'Refresh' }}
      </button>
      <a    *ngIf="can('create_students')" routerLink="/admin/student/add" class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 text-sm font-medium">
        <i class="fas fa-plus mr-2"></i> Add Student
      </a>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center mb-6">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-600 mx-auto"></div>
    <p class="text-gray-500 mt-2">Loading Students...</p>
  </div>

  <!-- Search -->
  <div *ngIf="!isLoading" class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
    <div class="flex items-center bg-gray-100 rounded-lg px-3 py-2 w-full">
      <i class="fas fa-search text-gray-400 mr-2"></i>
      <input type="text" [formControl]="searchControl" placeholder="Search students..." class="bg-transparent border-none focus:outline-none focus:ring-0 w-full text-sm" />
    </div>
  </div>

  <!-- Table -->
  <div *ngIf="!isLoading && students.length > 0" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
    <div class="hidden md:block overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Full Name</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let student of students; trackBy: trackById" class="hover:bg-gray-50">
            <td class="px-6 py-4 text-sm text-gray-900">{{ student.id }}</td>
            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ student.first_name }} {{ student.last_name }}</td>
            <td class="px-6 py-4 text-sm text-gray-600">{{ student.email }}</td>

            <td class="px-6 py-4 text-sm whitespace-nowrap">
              <div class="flex space-x-2">
                <a    *ngIf="can('edit_students')" [routerLink]="['/admin/student/edit', student?.id]" class="px-3 py-1 bg-orange-100 text-orange-700 rounded hover:bg-orange-200 text-xs font-medium">Edit</a>
                <button     *ngIf="can('delete_students')"(click)="deleteStudent(student.id)" class="px-3 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 text-xs font-medium">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
