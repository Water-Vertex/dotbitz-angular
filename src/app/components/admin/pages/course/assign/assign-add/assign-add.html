<div class="space-y-6">

  <!-- Header -->
  <div class="bg-white rounded-xl border border-gray-200 p-6 flex justify-between items-center shadow-sm">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Assign Course to Instructor</h1>
      <p class="text-gray-500 mt-1 text-sm">Assign a course to one or more instructors</p>
    </div>
    <a routerLink="/admin/course/assign-list"
      class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">
      <i class="bi bi-arrow-left"></i> Back to List
    </a>
  </div>

  <!-- Form -->
  <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-6">

    <!-- Course Dropdown -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Course <span class="text-red-500">*</span>
      </label>
      <div *ngIf="loadingCourses" class="text-sm text-gray-500">
        <i class="bi bi-arrow-repeat animate-spin"></i> Loading courses...
      </div>
      <select *ngIf="!loadingCourses" [(ngModel)]="selectedCourseId"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option [ngValue]="null">-- Select Course --</option>
        <option *ngFor="let course of courses" [value]="course.id">
          {{ course.course_name }}
        </option>
      </select>
    </div>

    <!-- Instructor Dropdown -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Instructor <span class="text-red-500">*</span>
      </label>
      <div *ngIf="loadingInstructors" class="text-sm text-gray-500">
        <i class="bi bi-arrow-repeat animate-spin"></i> Loading instructors...
      </div>
      <select *ngIf="!loadingInstructors" [(ngModel)]="selectedInstructorId"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option [ngValue]="null">-- Select Instructor --</option>
        <option *ngFor="let instructor of instructors" [value]="instructor.id">
          {{ instructor.first_name }} {{ instructor.last_name }}
        </option>
      </select>
    </div>

    <!-- Submit -->
    <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
      <a routerLink="/admin/course/assign-list"
        class="px-4 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50">
        Cancel
      </a>
      <button (click)="onSubmit()" [disabled]="submitting"
        class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed">
        {{ submitting ? 'Assigning...' : 'Assign Instructor' }}
      </button>
    </div>

  </div>
</div>
