<div class="p-6 max-w-5xl mx-auto">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Edit Programatic SEO Record</h2>
    <button (click)="goBack()" class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors">
      ← Back to List
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-12">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
    <p class="mt-2 text-gray-600">Loading record...</p>
  </div>

  <!-- Edit Form -->
  <div *ngIf="!loading && record" class="bg-white rounded-lg shadow-md overflow-hidden">
    <div class="p-6">
      <form (ngSubmit)="saveRecord()">
        <!-- Focus Keyword -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Focus Keyword *</label>
          <input type="text" [(ngModel)]="record.focus_keyword" name="focus_keyword" required
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- H1 Heading -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">H1 Heading</label>
          <input type="text" [(ngModel)]="record.h1_heading" name="h1_heading"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Content -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Content</label>
          <textarea [(ngModel)]="record.content" name="content" rows="6"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <!-- Image Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Image URL</label>
            <input type="text" [(ngModel)]="record.image" name="image"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Image Alt Text</label>
            <input type="text" [(ngModel)]="record.image_alt" name="image_alt"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- FAQs -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">FAQs (JSON format)</label>
          <textarea [(ngModel)]="record.faqs" name="faqs" rows="4"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder='[{"question":"Q1","answer":"A1"},{"question":"Q2","answer":"A2"}]'></textarea>
        </div>

        <!-- Section Content Left & Right -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Section Content Left</label>
            <textarea [(ngModel)]="record.section_content_left" name="section_content_left" rows="3"
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Section Content Right</label>
            <textarea [(ngModel)]="record.section_content_right" name="section_content_right" rows="3"
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
        </div>

        <!-- Left Image -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Left Image URL</label>
            <input type="text" [(ngModel)]="record.image_left" name="image_left"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Left Image Alt</label>
            <input type="text" [(ngModel)]="record.image_left_alt" name="image_left_alt"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Right Image -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Right Image URL</label>
            <input type="text" [(ngModel)]="record.image_right" name="image_right"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Right Image Alt</label>
            <input type="text" [(ngModel)]="record.image_right_alt" name="image_right_alt"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Form Actions -->
        <div class="flex gap-3 pt-4 border-t border-gray-200">
          <button type="submit" [disabled]="saving"
                  class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            {{ saving ? 'Saving...' : '💾 Save Changes' }}
          </button>
          <button type="button" (click)="goBack()"
                  class="px-6 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors">
            Cancel
          </button>
        </div>

        <!-- Message -->
        <div *ngIf="message" class="mt-4 p-3 rounded-md" [class.bg-green-50]="isSuccess" [class.bg-red-50]="!isSuccess" [class.text-green-800]="isSuccess" [class.text-red-800]="!isSuccess">
          {{ message }}
        </div>
      </form>
    </div>
  </div>
</div>
