<div class="min-h-screen bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Back & Edit Buttons -->
    <div class="flex justify-end gap-3 mb-6">
      <button (click)="goBack()" class="inline-flex items-center gap-2 text-gray-500 hover:text-gray-700 font-medium transition-colors">
        <i class="fas fa-arrow-left text-sm"></i>
        Back
      </button>
      <button (click)="editRecord()" *ngIf="record" class="inline-flex items-center gap-2 px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-800 transition-colors">
        <i class="fas fa-edit text-sm"></i>
        Edit
      </button>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gray-900"></div>
      <p class="text-gray-500 mt-4">Loading record details...</p>
    </div>

    <!-- Main Content -->
    <div *ngIf="!loading && record" class="space-y-12">
      
      <!-- Hero Section -->
      <div class="text-center border-b border-gray-200 pb-8">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">
          {{ record.focus_keyword }}
        </h1>
        <p class="text-xl text-gray-600 max-w-3xl mx-auto">
          {{ record.h1_heading }}
        </p>
      </div>

      <!-- Main Content -->
      <div class="prose prose-lg max-w-none text-gray-600">
        <div [innerHTML]="record.content"></div>
      </div>

      <!-- Main Image Section -->
      <div *ngIf="record.image" class="my-8">
        <img [src]="record.image" [alt]="record.image_alt" class="w-full rounded-2xl shadow-lg object-cover max-h-[500px]">
        <p *ngIf="record.image_alt" class="text-sm text-gray-400 text-center mt-3">{{ record.image_alt }}</p>
      </div>

      <!-- Two Column Layout 1: Image Left, Content Right -->
      <div *ngIf="record.image_left || record.section_content_left" class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center my-12">
        <div *ngIf="record.image_left">
          <img [src]="record.image_left" [alt]="record.image_left_alt" class="w-full rounded-2xl shadow-lg object-cover">
          <p *ngIf="record.image_left_alt" class="text-sm text-gray-400 text-center mt-2">{{ record.image_left_alt }}</p>
        </div>
        <div class="prose prose-lg max-w-none text-gray-600">
          <div [innerHTML]="record.section_content_left"></div>
        </div>
      </div>

      <!-- Two Column Layout 2: Content Left, Image Right -->
      <div *ngIf="record.image_right || record.section_content_right" class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center my-12">
        <div class="order-2 lg:order-1 prose prose-lg max-w-none text-gray-600">
          <div [innerHTML]="record.section_content_right"></div>
        </div>
        <div *ngIf="record.image_right" class="order-1 lg:order-2">
          <img [src]="record.image_right" [alt]="record.image_right_alt" class="w-full rounded-2xl shadow-lg object-cover">
          <p *ngIf="record.image_right_alt" class="text-sm text-gray-400 text-center mt-2">{{ record.image_right_alt }}</p>
        </div>
      </div>

      <!-- FAQs Section - Clean Display -->
      <div *ngIf="faqsArray.length > 0" class="bg-gray-50 rounded-2xl p-8 my-12">
        <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Frequently Asked Questions</h2>
        <div class="space-y-6 max-w-3xl mx-auto">
          <div *ngFor="let faq of faqsArray; let i = index" class="border-b border-gray-200 pb-4 last:border-0">
            <div class="flex items-start gap-3">
              <div class="flex-shrink-0 w-7 h-7 bg-gray-200 rounded-full flex items-center justify-center">
                <span class="text-gray-700 text-sm font-bold">{{ i + 1 }}</span>
              </div>
              <div class="flex-1">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ faq.question }}</h3>
                <p class="text-gray-600 leading-relaxed">{{ faq.answer }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
