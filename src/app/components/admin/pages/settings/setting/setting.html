<div class="space-y-6">
  <!-- Header -->
  <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
    <h1 class="text-2xl font-bold text-gray-900">Site Settings</h1>
    <p class="text-gray-500 mt-1 text-sm">Manage your site configuration</p>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="bg-white rounded-xl border p-8 text-center">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
    <p class="text-gray-500 mt-2">Loading settings...</p>
  </div>

  <!-- Settings Form -->
  <div *ngIf="!loading" class="space-y-6">

    <!-- Logos -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-4">
      <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">Logos & Favicon</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Main Logo -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Main Logo</label>
          <img *ngIf="mainLogoPreview" [src]="mainLogoPreview" class="h-16 mb-2 object-contain border rounded">
          <div *ngIf="!mainLogoPreview && settings.main_logo" class="h-16 mb-2 flex items-center">
            <span class="text-xs text-gray-500">Logo saved</span>
          </div>
          <input type="file" accept="image/*" (change)="onFileChange($event, 'main_logo')"
            class="w-full text-sm text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700">
        </div>

        <!-- Footer Logo -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Footer Logo</label>
          <img *ngIf="footerLogoPreview" [src]="footerLogoPreview" class="h-16 mb-2 object-contain border rounded">
          <div *ngIf="!footerLogoPreview && settings.footer_logo" class="h-16 mb-2 flex items-center">
            <span class="text-xs text-gray-500">Logo saved</span>
          </div>
          <input type="file" accept="image/*" (change)="onFileChange($event, 'footer_logo')"
            class="w-full text-sm text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700">
        </div>

        <!-- Favicon -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Favicon</label>
          <img *ngIf="faviconPreview" [src]="faviconPreview" class="h-10 mb-2 object-contain border rounded">
          <div *ngIf="!faviconPreview && settings.favicon" class="h-10 mb-2 flex items-center">
            <span class="text-xs text-gray-500">Favicon saved</span>
          </div>
          <input type="file" accept="image/*,.ico" (change)="onFileChange($event, 'favicon')"
            class="w-full text-sm text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700">
        </div>
      </div>
    </div>

    <!-- General Info -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-4">
      <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">General Information</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Site Title</label>
          <input type="text" [(ngModel)]="settings.site_title" placeholder="Enter site title"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" [(ngModel)]="settings.email" placeholder="contact@example.com"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
          <input type="text" [(ngModel)]="settings.phone" placeholder="+92 300 0000000"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
          <input type="text" [(ngModel)]="settings.address" placeholder="123 Street, City"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">About</label>
          <textarea [(ngModel)]="settings.about" rows="3" placeholder="Brief about your site..."
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
      </div>
    </div>

    <!-- Social Media -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-4">
      <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">Social Media Links</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 capitalize">Facebook</label>
          <input type="url" [(ngModel)]="settings.facebook" placeholder="https://facebook.com/yourpage"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 capitalize">Twitter</label>
          <input type="url" [(ngModel)]="settings.twitter" placeholder="https://twitter.com/yourpage"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 capitalize">LinkedIn</label>
          <input type="url" [(ngModel)]="settings.linkedin" placeholder="https://linkedin.com/in/yourpage"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 capitalize">Instagram</label>
          <input type="url" [(ngModel)]="settings.instagram" placeholder="https://instagram.com/yourpage"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 capitalize">Pinterest</label>
          <input type="url" [(ngModel)]="settings.pintrest" placeholder="https://pinterest.com/yourpage"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 capitalize">YouTube</label>
          <input type="url" [(ngModel)]="settings.youtube" placeholder="https://youtube.com/c/yourchannel"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
    </div>

    <!-- Meta / Scripts -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-4">
      <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">Meta & Scripts</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Meta Title</label>
          <input type="text" [(ngModel)]="settings.meta_title"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Meta Keywords</label>
          <input type="text" [(ngModel)]="settings.meta_keywords"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Meta Description</label>
          <textarea [(ngModel)]="settings.meta_desc" rows="2"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Meta Tags</label>
          <textarea [(ngModel)]="settings.meta_tags" rows="2" placeholder="&lt;meta name='author' content=''&gt;"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Head Tags (Scripts/CSS)</label>
          <textarea [(ngModel)]="settings.head_tags" rows="3" placeholder="&lt;script&gt;...&lt;/script&gt;"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Body Tags (Scripts)</label>
          <textarea [(ngModel)]="settings.body_tags" rows="3" placeholder="&lt;script&gt;...&lt;/script&gt;"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
      </div>
    </div>

    <!-- Save Button -->
    <div class="flex justify-end">
      <button (click)="saveSettings()" [disabled]="saving"
        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium disabled:opacity-50 transition-colors">
        {{ saving ? 'Saving...' : 'Save Settings' }}
      </button>
    </div>

 

  </div>
</div>
