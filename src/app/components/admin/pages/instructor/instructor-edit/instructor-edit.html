<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">
        Edit Instructor
      </h1>
      <p class="text-gray-600 mt-1">
        Update instructor details
      </p>
    </div>

    <a
      routerLink="/admin/instructor/list"
      class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors flex items-center space-x-2 text-sm font-medium"
    >
      <i class="fas fa-arrow-left"></i>
      <span>Back</span>
    </a>
  </div>
</div>

<!-- Loading State -->
<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading instructor details...</p>
</div>

<!-- Form -->
<div *ngIf="!isLoading" class="space-y-6">
  <div class="bg-white rounded-lg border border-gray-200 p-6">
    <form [formGroup]="instructorForm" (ngSubmit)="onSubmit()" class="space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- First Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          First Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="first_name"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <!-- Last Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Last Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="last_name"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Email <span class="text-red-500">*</span>
        </label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <!-- Phone -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Phone <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="phone"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <!-- Gender -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Gender</label>
        <select
          formControlName="gender"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm"
        >
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Status -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
        <select
          formControlName="status"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm"
        >
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
</div>
      <!-- Address -->
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-2">Address</label>
        <textarea
          rows="3"
          formControlName="address"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm resize-none"
        ></textarea>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
   <!-- State -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">State</label>
        <input
          type="text"
          formControlName="state"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter state"
        >
        
        </div>
      <!-- City -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
        <input
          type="text"
          formControlName="city"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter city"
        >
        </div>
      <!-- Zip Code -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Zip Code</label>
        <input
          type="text"
          formControlName="zip_code"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter zip code"
        >
        </div>
      <!-- Work Experience -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Work Experience</label>
        <input
          type="text"
          formControlName="work_experience"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter work experience"
        >
        </div>
      <!-- Salary -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Salary</label>
        <input
          type="text"
          formControlName="salary"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter salary"
        >
        </div>
 <!-- Status -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
        <select
          formControlName="status"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
</div>

      <!-- Education -->
      <div class="md:col-span-2 border-t border-gray-300 pt-6">
        <h3 class="text-gray-900 font-semibold mb-4">Education Details</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Institution *</label>
            <input
              type="text"
              formControlName="institution"
              class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Degree *</label>
            <input
              type="text"
              formControlName="degree"
              class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Field of Study</label>
            <input
              type="text"
              formControlName="field_of_study"
              class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Start Date *</label>
            <input type="date" formControlName="start_date" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">End Date</label>
            <input type="date" formControlName="end_date" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex justify-end space-x-3 pt-6 border-t">
        <button
          type="button"
          (click)="cancel()"
          class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="isSubmitting"
        >
        <i class="fas fa-times"></i>
         <span>Cancel</span>
        </button>

        <button 
          type="submit"
          [disabled]="instructorForm.invalid || isSubmitting"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
        >
          <span *ngIf="!isSubmitting" class="flex items-center space-x-2">
            <i class="fas fa-save"></i>
            <span>Update Instructor</span>
          </span>
          <span *ngIf="isSubmitting" class="flex items-center space-x-2">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
            <span>Saving...</span>
          </span>
        </button>
      </div>

    </form>
  </div>
</div>
