<div class="space-y-6">

  <!-- Header -->
  <div class="bg-white rounded-lg border border-gray-200 p-6 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Edit MCQ</h1>
      <p class="text-gray-600 mt-1">Update the multiple choice question</p>
    </div>
    <a routerLink="/admin/mcqs" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors flex items-center space-x-2 text-sm font-medium">
      <i class="bi bi-arrow-left"></i>
      <span>Back to List</span>
    </a>
  </div>

  <!-- Form Card -->
  <div class="bg-white rounded-lg border border-gray-200 p-6">
    <form [formGroup]="mcqForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Question -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Question <span class="text-red-500">*</span>
        </label>
        <textarea formControlName="question" rows="4"
          placeholder="Enter your question here..."
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          [class.border-red-300]="mcqForm.get('question')?.invalid && mcqForm.get('question')?.touched"
          [class.focus:ring-red-500]="mcqForm.get('question')?.invalid && mcqForm.get('question')?.touched"></textarea>
        <small class="text-gray-500">Write a clear and concise question</small>
      </div>

      <!-- Course -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Course <span class="text-red-500">*</span>
        </label>
        <div *ngIf="coursesLoading" class="flex items-center space-x-2 text-blue-600">
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
          <span>Loading courses...</span>
        </div>

        <select formControlName="course_id" 
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          [disabled]="coursesLoading || courses.length === 0"
          [class.border-red-300]="mcqForm.get('course_id')?.invalid && mcqForm.get('course_id')?.touched">
          <option value="">-- Select Course --</option>
          <option *ngFor="let course of courses" [value]="course.id">
            {{ course.course_name }} <span *ngIf="course.course_code">({{ course.course_code }})</span>
          </option>
        </select>
      </div>

      <!-- Answer Type -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Answer Type <span class="text-red-500">*</span></label>
        <div class="flex space-x-4">
          <label class="flex items-center space-x-2 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 cursor-pointer hover:bg-gray-100">
            <input type="radio" formControlName="issingle" [value]="true">
            <span>Single Answer</span>
          </label>
          <label class="flex items-center space-x-2 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 cursor-pointer hover:bg-gray-100">
            <input type="radio" formControlName="issingle" [value]="false">
            <span>Multiple Answers</span>
          </label>
        </div>
      </div>

      <!-- Options -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-sm font-medium text-gray-700">Options <span class="text-red-500">*</span>
            <small class="text-gray-500 ml-2">(Minimum 2 required)</small>
          </label>
          <button type="button" (click)="addOption()" 
            class="px-3 py-1 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm flex items-center space-x-1"
            [disabled]="options.length >= 10">
            <i class="bi bi-plus-circle"></i>
            <span>Add Option</span>
          </button>
        </div>

        <div class="text-blue-600 mb-2">
          <i class="bi bi-info-circle"></i>
          {{ isSingle ? 'Select ONE radio button for the correct answer' : 'Select MULTIPLE checkboxes for correct answers' }}
        </div>

        <div formArrayName="options" class="space-y-2">
          <div *ngFor="let option of options.controls; let i = index" [formGroupName]="i" class="flex items-center space-x-2">
            <div>{{ i + 1 }}.</div>
            <div>
              <input *ngIf="isSingle" type="radio" name="correctAnswer" [value]="i" [checked]="isCorrectAnswer(i)" class="cursor-pointer">
              <input *ngIf="!isSingle" type="checkbox" [checked]="isCorrectAnswer(i)" (change)="onCorrectAnswerChange(i, $event)" class="cursor-pointer">
            </div>
            <input type="text" formControlName="value" placeholder="Enter option {{ i + 1 }}"
              class="flex-1 px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <button type="button" (click)="removeOption(i)" [disabled]="options.length <= 2"
              class="px-2 py-1 bg-red-600 text-white rounded-md hover:bg-red-700 text-sm">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Status -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
        <select formControlName="status" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>

      <!-- Form Actions -->
      <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
        <a routerLink="/admin/mcqs" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center space-x-2">
          <i class="bi bi-x"></i>
          <span>Cancel</span>
        </a>
        <button type="submit" [disabled]="mcqForm.invalid || loading"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors flex items-center space-x-2 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!loading" class="flex items-center space-x-2">
            <i class="bi bi-check-circle"></i>
            <span>Update MCQ</span>
          </span>
          <span *ngIf="loading" class="flex items-center space-x-2">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
            <span>Saving...</span>
          </span>
        </button>
      </div>

    </form>
  </div>
</div>
