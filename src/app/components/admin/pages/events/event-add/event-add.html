<div class="space-y-6">

  <!-- Header -->
  <div class="bg-white rounded-xl border border-gray-200 p-6 flex items-center justify-between shadow-sm">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">{{ isEdit ? 'Edit Event' : 'Add New Event' }}</h1>
      <p class="text-gray-500 mt-1 text-sm">
        {{ isEdit ? 'Update event details' : 'Create a new event for all users' }}
      </p>
    </div>
    <a routerLink="/admin/event/list"
      class="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 flex items-center
             gap-2 text-sm font-medium">
      <i class="fas fa-arrow-left"></i> Back to Events
    </a>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="bg-white rounded-xl border border-gray-200 p-12 text-center shadow-sm">
    <div class="animate-spin rounded-full h-8 w-8 border-2 border-gray-200 border-t-orange-600 mx-auto"></div>
    <p class="text-gray-500 mt-2 text-sm">Loading event...</p>
  </div>

  <div *ngIf="!loading" class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-5">

    <!-- Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        Event Name <span class="text-red-500">*</span>
      </label>
      <input type="text" [(ngModel)]="name" placeholder="e.g. Orientation Day 2025"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50
               focus:outline-none focus:ring-2 focus:ring-orange-500">
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
      <textarea [(ngModel)]="description" rows="3"
        placeholder="Brief description of the event..."
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50
               focus:outline-none focus:ring-2 focus:ring-orange-500 resize-none">
      </textarea>
    </div>

    <!-- Date + Location -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Date <span class="text-red-500">*</span>
        </label>
        <input type="date" [(ngModel)]="date"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50
                 focus:outline-none focus:ring-2 focus:ring-orange-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
        <input type="text" [(ngModel)]="location" placeholder="e.g. Main Hall, Room 201"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50
                 focus:outline-none focus:ring-2 focus:ring-orange-500">
      </div>
    </div>

    <!-- Start Time + End Time -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Start Time <span class="text-red-500">*</span>
        </label>
        <input type="datetime-local" [(ngModel)]="startTime"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50
                 focus:outline-none focus:ring-2 focus:ring-orange-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">End Time</label>
        <input type="datetime-local" [(ngModel)]="endTime"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50
                 focus:outline-none focus:ring-2 focus:ring-orange-500">
      </div>
    </div>

    <!-- Status -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
      <select [(ngModel)]="status"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50
               focus:outline-none focus:ring-2 focus:ring-orange-500">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <!-- Image -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Event Image</label>

      <!-- Existing image -->
      <div *ngIf="existingImage && !imagePreview" class="mb-3">
        <img [src]="existingImage" alt="Current image"
          class="h-32 w-auto rounded-lg object-cover border border-gray-200">
        <p class="text-xs text-gray-400 mt-1">Current image — upload new to replace</p>
      </div>

      <!-- Preview -->
      <div *ngIf="imagePreview" class="mb-3">
        <img [src]="imagePreview" alt="Preview"
          class="h-32 w-auto rounded-lg object-cover border border-gray-200">
      </div>

      <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center
                  hover:border-orange-400 transition-colors cursor-pointer"
        (click)="imageInput.click()">
        <i class="fas fa-cloud-upload-alt text-2xl text-gray-300 mb-2 block"></i>
        <p class="text-sm text-gray-500">Click to upload event image</p>
        <p class="text-xs text-gray-400 mt-1">PNG, JPG, JPEG (max 5MB)</p>
      </div>
      <input #imageInput type="file" accept="image/*" class="hidden"
        (change)="onImageChange($event)">
    </div>

    <!-- Submit -->
    <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
      <a routerLink="/admin/event/list"
        class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">
        Cancel
      </a>
      <button (click)="onSubmit()" [disabled]="saving"
        class="px-6 py-2 bg-orange-600 text-white rounded-lg text-sm font-medium
               hover:bg-orange-700 disabled:opacity-60 flex items-center gap-2">
        <span *ngIf="saving"
          class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
        {{ saving ? 'Saving...' : (isEdit ? 'Update Event' : 'Create Event') }}
      </button>
    </div>

  </div>
</div>
