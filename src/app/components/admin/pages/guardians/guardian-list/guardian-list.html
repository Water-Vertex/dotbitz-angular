<div class="container mx-auto px-4 py-8">
  <!-- Header -->
  <div class="bg-white rounded-lg border border-gray-200 p-6 mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Guardian Management</h1>
      <p class="text-gray-600 mt-1">Manage guardians and their details</p>
    </div>
    <div class="flex space-x-2">
      <button (click)="refreshData()" [disabled]="isLoading" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm font-medium">
        <i class="fas fa-sync-alt mr-2" [class.animate-spin]="isLoading"></i>
        {{ isLoading ? 'Refreshing...' : 'Refresh' }}
      </button>
      
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center mb-6">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-600 mx-auto"></div>
    <p class="text-gray-500 mt-2">Loading Guardians...</p>
  </div>

  <!-- Search -->
  <div *ngIf="!isLoading" class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
    <div class="flex items-center bg-gray-100 rounded-lg px-3 py-2 w-full">
      <i class="fas fa-search text-gray-400 mr-2"></i>
      <input type="text" [formControl]="searchControl" placeholder="Search guardians by name or email..." class="bg-transparent border-none focus:outline-none focus:ring-0 w-full text-sm" />
    </div>
  </div>

  <!-- Table -->
  <div *ngIf="!isLoading && guardians.length > 0" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
    <div class="hidden md:block overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Full Name</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>

          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let guardian of guardians; trackBy: trackById" class="hover:bg-gray-50">
            <td class="px-6 py-4 text-sm text-gray-900">{{ guardian.id }}</td>
            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ guardian.first_name }} {{ guardian.last_name }}</td>
            <td class="px-6 py-4 text-sm text-gray-600">{{ guardian.email }}</td>
            <td class="px-6 py-4 text-sm text-gray-600">{{ guardian.phone || '-' }}</td>
            <td class="px-6 py-4 text-sm whitespace-nowrap">
              <div class="flex space-x-2">

              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- No Data -->
  <div *ngIf="!isLoading && guardians.length === 0" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
    <i class="fas fa-users text-gray-300 text-5xl mb-3"></i>
    <p class="text-gray-500">No guardians found</p>
    <a routerLink="/admin/guardian/add" class="inline-block mt-3 text-orange-600 hover:text-orange-700 text-sm font-medium">
      <i class="fas fa-plus mr-1"></i> Add your first guardian
    </a>
  </div>
</div>

<!-- Add Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
