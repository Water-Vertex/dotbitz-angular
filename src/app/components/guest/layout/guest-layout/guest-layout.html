<style>
    /* Styles original hi hain */
    .sidebar-mobile { position: fixed; left: -100%; top: 0; bottom: 0; z-index: 1000; transition: left 0.3s ease; width: 280px; }
    .sidebar-mobile.active { left: 0; }
    .mobile-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 999; }
    .mobile-overlay.active { display: block; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    @media (max-width: 1024px) {
        .desktop-sidebar { display: none; }
        .mobile-menu-btn { display: block !important; }
    }
</style>

<div class="mobile-overlay bg-black bg-opacity-40" [class.active]="isSidebarActive" (click)="toggleSidebar()"></div>

<div class="flex h-screen bg-gray-50">
    <div class="desktop-sidebar w-64 bg-[#063989] text-white shadow-lg flex flex-col border-r border-gray-200">
        <div class="p-4 border-b border-white/10">
            <div class="flex items-center space-x-3">
                 <img src="../../../../../assets/images/logo/dotbitz-logo.png" alt="DotBitz Logo" width="150">
            </div>
        </div>

        <nav class="flex-1 mt-4 overflow-y-auto no-scrollbar">
            <div class="px-4 space-y-1">
                <div class="mb-6 mt-1">
                    <h3 class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Main Menu</h3>

                    <!-- Assessments Link -->
                    <a routerLink="/guest/guest-assessments" routerLinkActive="bg-[#FF6B00] text-white"
                       class="flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors duration-200 text-white hover:bg-white/10">
                        <i class="fas fa-file-circle-question mr-3 w-5 text-center"></i>
                        Assessments
                    </a>

                    <!-- ✅ NEW: Assessment Result Link -->
                    <a routerLink="/guest/assessment-result" routerLinkActive="bg-[#FF6B00] text-white"
                       class="flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors duration-200 text-white hover:bg-white/10 mt-1">
                        <i class="fas fa-chart-line mr-3 w-5 text-center"></i>
                        Assessment Result
                    </a>
                </div>
            </div>
        </nav>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white border-b border-gray-200 shadow-sm">
            <div class="flex justify-between items-center px-4 lg:px-6 py-4">
                <div class="flex items-center space-x-4">
                    <button class="lg:hidden text-gray-600 p-2" (click)="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="flex items-center space-x-2 text-sm text-gray-600">
                        <span>Guest Console</span>
                        <i class="fas fa-chevron-right text-xs text-gray-300"></i>
                        <span class="font-semibold text-gray-900">Assessments</span>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <div class="hidden sm:block text-right">
                        <p class="text-sm font-semibold text-gray-900">{{ getUsername() }}</p>
                        <p class="text-xs text-blue-700 font-medium">{{ getEmail() }}</p>
                    </div>
                    <div class="w-10 h-10 bg-orange-500 rounded-lg flex items-center justify-center text-white font-semibold">
                        {{ userInitials }}
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 lg:p-6">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
