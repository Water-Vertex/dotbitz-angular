<style>
    /* Keep only essential non-Tailwind styles */
    .sidebar-mobile {
        position: fixed;
        left: -100%;
        top: 0;
        bottom: 0;
        z-index: 1000;
        transition: left 0.3s ease;
    }

    .sidebar-mobile.active {
        left: 0;
    }

    .mobile-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 999;
    }

    .mobile-overlay.active {
        display: block;
    }

    .mobile-user-dropdown {
        position: fixed;
        top: 70px;
        right: 1rem;
        width: 280px;
        max-width: calc(100vw - 2rem);
        z-index: 1001;
        display: none;
    }

    .mobile-user-dropdown.active {
        display: block;
    }

    .responsive-table-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
        .desktop-sidebar {
            display: none;
        }

        .mobile-menu-btn {
            display: block !important;
        }

        .mobile-user-menu {
            display: none !important;
        }

        .mobile-only {
            display: block !important;
        }

        .desktop-only {
            display: none !important;
        }

        .search-bar {
            max-width: 200px;
        }
    }

    @media (max-width: 768px) {
        .search-bar {
            display: none !important;
        }

        .mobile-search-btn {
            display: block !important;
        }

        .breadcrumb-text {
            display: none !important;
        }

        .header-title {
            font-size: 1rem;
        }

        .main-content {
            padding: 1rem !important;
        }
    }

    @media (max-width: 640px) {
        .header-right > :not(:last-child) {
            display: none !important;
        }

        .notifications-btn, .help-btn {
            display: none !important;
        }

        .mobile-user-btn {
            display: block !important;
        }
    }
    
    .submenu {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height 0.3s ease, opacity 0.3s ease;
    }

    .submenu.active {
        max-height: 300px;
        opacity: 1;
    }

    .menu-toggle-btn .fa-chevron-down {
        transition: transform 0.3s ease;
    }

    .menu-toggle-btn.active .fa-chevron-down {
        transform: rotate(180deg);
    }
    
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
</style>

</div>
