<div
  class="min-h-screen bg-gradient-to-br from-gray-50 via-blue-50 to-indigo-50 py-8 px-4 sm:px-6 lg:px-8"
>
  <div class="max-w-6xl mx-auto">
    <div class="mb-8">
      <button
        (click)="goBack()"
        class="inline-flex items-center text-gray-600 hover:text-blue-600 mb-4 transition-colors font-medium"
      >
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 19l-7-7 7-7"
          />
        </svg>
        Back to Profile
      </button>

      <div class="flex items-center space-x-5">
        <div
          class="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-200"
        >
          <i class="fas fa-user-edit text-3xl"></i>
        </div>
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Edit Profile</h1>
          <p class="text-gray-600 mt-1">Update your personal information and contact details.</p>
        </div>
      </div>
    </div>

    <div
      *ngIf="success"
      class="mb-6 bg-green-50 border-l-4 border-green-500 p-4 rounded-xl animate-in fade-in slide-in-from-top-4 duration-500"
    >
      <div class="flex items-center">
        <i class="fas fa-check-circle text-green-500 mr-3 text-xl"></i>
        <div>
          <p class="text-green-800 font-bold text-lg">{{ success }}</p>
          <p class="text-green-600 text-sm">Redirecting to your profile...</p>
        </div>
      </div>
    </div>

    <div *ngIf="error" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-xl">
      <div class="flex items-start">
        <i class="fas fa-exclamation-circle text-red-500 mr-3 mt-1 text-xl"></i>
        <p class="text-red-800 font-bold whitespace-pre-line">{{ error }}</p>
      </div>
    </div>

    <form
      [formGroup]="profileForm"
      (ngSubmit)="saveProfile()"
      class="bg-white rounded-3xl shadow-xl shadow-blue-900/5 border border-gray-100 overflow-hidden"
    >
      <div class="px-8 py-6 bg-gradient-to-r from-gray-50 to-white border-b border-gray-100">
        <h2 class="text-xl font-bold text-gray-900 flex items-center">
          <span
            class="w-8 h-8 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center mr-3"
          >
            <i class="fas fa-id-card text-sm"></i>
          </span>
          Basic Information
        </h2>
      </div>

      <div class="p-8 lg:p-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700"
              >First Name <span class="text-red-500">*</span></label
            >
            <input
              type="text"
              formControlName="first_name"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all outline-none bg-gray-50/50"
            />
          </div>

          <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700"
              >Last Name <span class="text-red-500">*</span></label
            >
            <input
              type="text"
              formControlName="last_name"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all outline-none bg-gray-50/50"
            />
          </div>

          <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700">Gender</label>
            <select
              formControlName="gender"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all outline-none bg-gray-50/50 appearance-none"
            >
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700">Relationship</label>
            <input
              type="text"
              formControlName="relationship"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all outline-none bg-gray-50/50"
              placeholder="e.g. Father, Mother"
            />
          </div>
        </div>
      </div>

      <div class="px-8 py-6 bg-gradient-to-r from-gray-50 to-white border-y border-gray-100">
        <h2 class="text-xl font-bold text-gray-900 flex items-center">
          <span
            class="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center mr-3"
          >
            <i class="fas fa-envelope text-sm"></i>
          </span>
          Contact Details
        </h2>
      </div>

      <div class="p-8 lg:p-10 bg-gray-50/30">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700">Email Address</label>
            <input
              formControlName="email"
              type="email"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed italic"
              readonly
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700">Phone Number</label>
            <input
              formControlName="phone"
              type="tel"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all outline-none bg-gray-50/50"
            />
          </div>
        </div>
      </div>

      <div class="px-8 py-6 bg-gradient-to-r from-gray-50 to-white border-y border-gray-100">
        <h2 class="text-xl font-bold text-gray-900 flex items-center">
          <span
            class="w-8 h-8 bg-green-100 text-green-600 rounded-lg flex items-center justify-center mr-3"
          >
            <i class="fas fa-map-marked-alt text-sm"></i>
          </span>
          Address & Location
        </h2>
      </div>

      <div class="p-8 lg:p-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <div class="md:col-span-2 space-y-2">
            <label class="block text-sm font-bold text-gray-700">Street Address</label>
            <input
              type="text"
              formControlName="address"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-green-500/10 focus:border-blue-500 transition-all outline-none bg-gray-50/50"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700">City</label>
            <input
              type="text"
              formControlName="city"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-green-500/10 focus:border-blue-500 transition-all outline-none bg-gray-50/50"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700">State / Province</label>
            <input
              type="text"
              formControlName="state"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-green-500/10 focus:border-blue-500 transition-all outline-none bg-gray-50/50"
            />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-bold text-gray-700">Zipcode</label>
            <input
              type="text"
              formControlName="zipcode"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-green-500/10 focus:border-blue-500 transition-all outline-none bg-gray-50/50"
            />
          </div>
        </div>
      </div>

      <div
        class="px-8 py-8 bg-gray-50 border-t border-gray-100 flex flex-col sm:flex-row justify-end gap-4"
      >
        <button
          type="button"
          (click)="goBack()"
          [disabled]="loading"
          class="px-8 py-3 rounded-xl font-bold text-gray-600 hover:bg-gray-200 transition-all disabled:opacity-50"
        >
          Cancel
        </button>

        <button
          type="submit"
          [disabled]="loading || profileForm.invalid"
          class="bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white px-10 py-3 rounded-xl font-bold shadow-lg shadow-blue-200 transition-all flex items-center justify-center min-w-[180px]"
        >
          <svg
            *ngIf="loading"
            class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          {{ loading ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
</div>
