<div class="min-h-screen flex bg-gray-50">

  <!-- Sidebar -->
  <aside class="hidden lg:flex lg:flex-col w-64 bg-gray-900 text-white border-r border-gray-700 shadow-lg">

    <!-- Logo -->
    <div class="p-6 border-b border-gray-700 flex items-center space-x-3">
      <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-blue-600 rounded-lg flex items-center justify-center shadow-md">
        <i class="fas fa-user-graduate text-white text-lg"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-white">Dreamz Edu</h2>
        <p class="text-sm text-gray-400 mt-1">Student Dashboard</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 mt-4 overflow-y-auto no-scrollbar p-4 space-y-6">
      <div>
        <h3 class="text-xs font-semibold text-gray-400 uppercase mb-3">
          Main Menu
        </h3>

        <a routerLink="/student/dashboard"
           routerLinkActive="bg-gray-50 text-gray-900"
           class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-white hover:bg-gray-50 hover:text-gray-900 transition">
          <i class="fas fa-chart-bar mr-3 w-5 text-center"></i>
          Dashboard
        </a>

        <a routerLink="/student/courses"
           routerLinkActive="bg-gray-50 text-gray-900"
           class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-white hover:bg-gray-50 hover:text-gray-900 transition">
          <i class="fas fa-book mr-3 w-5 text-center"></i>
          My Courses
        </a>

        <a routerLink="/student/assignments"
           routerLinkActive="bg-gray-50 text-gray-900"
           class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-white hover:bg-gray-50 hover:text-gray-900 transition">
          <i class="fas fa-file-alt mr-3 w-5 text-center"></i>
          Assignments
        </a>

        <a routerLink="/student/grades"
           routerLinkActive="bg-gray-50 text-gray-900"
           class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-white hover:bg-gray-50 hover:text-gray-900 transition">
          <i class="fas fa-graduation-cap mr-3 w-5 text-center"></i>
          Grades
        </a>

      </div>
    </nav>

  </aside>


  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm">
      <div class="flex justify-between items-center px-4 lg:px-6 py-4">

        <h1 class="text-lg font-semibold text-gray-900">
          Student Dashboard
        </h1>

        <!-- User Dropdown -->
        <div class="relative">

          <button
            (click)="toggleUserMenu()"
            class="flex items-center space-x-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition">

            <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center">
              <span class="text-white text-sm font-semibold">
                {{ currentUser?.name?.charAt(0) }}
              </span>
            </div>

            <span class="hidden sm:block text-sm font-medium text-gray-700">
              {{ currentUser?.name }}
            </span>

            <i class="fas fa-chevron-down text-xs text-gray-400"></i>
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="isUserMenuOpen"
               class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border z-50">

            <div class="px-4 py-3 border-b">
              <p class="text-sm font-semibold text-gray-800">
                {{ currentUser?.name }}
              </p>
              <p class="text-xs text-gray-500">
                {{ currentUser?.email }}
              </p>
            </div>
            <!-- Existing dropdown button -->
<a routerLink="/student/profile"
   class="flex items-center w-full text-left px-4 py-3 text-sm hover:bg-blue-50 hover:text-blue-600 transition">
  <i class="fas fa-user mr-2"></i>
  Profile
</a>

            <button (click)="logout()"
                    class="w-full text-left px-4 py-3 text-sm hover:bg-red-50 hover:text-red-600 transition">
              <i class="fas fa-sign-out-alt mr-2"></i>
              Sign Out
            </button>

          </div>

        </div>

      </div>
    </header>


    <!-- Main Router Area -->
    <main class="flex-1 overflow-y-auto bg-gray-50 p-6">

      <ng-container *ngIf="!isLoggingOut; else logoutScreen">
        <router-outlet></router-outlet>
      </ng-container>

      <ng-template #logoutScreen>
        <div class="flex items-center justify-center h-full">
          <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent mx-auto mb-4"></div>
            <p class="text-gray-600 font-medium">Logging out...</p>
          </div>
        </div>
      </ng-template>

    </main>

  </div>
</div>
