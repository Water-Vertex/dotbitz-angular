<!-- Loading State -->
<div *ngIf="loading" class="flex flex-col justify-center items-center min-h-screen bg-gray-50">
  <div class="relative">
    <div class="animate-spin h-16 w-16 border-4 border-blue-500 border-t-transparent rounded-full"></div>
    <div class="absolute inset-0 animate-ping h-16 w-16 border-4 border-blue-300 border-t-transparent rounded-full opacity-20"></div>
  </div>
  <p class="mt-6 text-gray-600 font-medium text-lg">Loading profile...</p>
</div>

<!-- Edit Form -->
<div *ngIf="!loading" class="min-h-screen bg-gradient-to-br from-gray-50 via-blue-50 to-indigo-50 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto">
    
    <!-- Header -->
    <div class="mb-8">
      <button (click)="onCancel()" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-4 transition-colors">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to Profile
      </button>
      
      <div class="flex items-center space-x-4">
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-green-400 via-blue-500 to-purple-600 flex items-center justify-center text-white text-2xl font-bold">
          {{ getInitials() }}
        </div>
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Edit Profile</h1>
          <p class="text-gray-600 mt-1">Update your personal information</p>
        </div>
      </div>
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="mb-6 bg-green-50 border-l-4 border-green-500 p-4 rounded-lg">
      <div class="flex items-center">
        <svg class="w-6 h-6 text-green-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p class="text-green-800 font-medium">{{ successMessage }}</p>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-lg">
      <div class="flex items-start">
        <svg class="w-6 h-6 text-red-500 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p class="text-red-800 whitespace-pre-line">{{ error }}</p>
      </div>
    </div>

    <!-- Form Card -->
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="bg-white rounded-2xl shadow-xl overflow-hidden">
      
      <!-- Form Header -->
      <div class="px-8 py-5 bg-gradient-to-r from-gray-50 to-blue-50 border-b border-gray-200">
        <h2 class="text-xl font-bold text-gray-900 flex items-center">
          <svg class="w-6 h-6 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Personal Information
        </h2>
      </div>

      <!-- Form Fields -->
      <div class="p-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          
          <!-- First Name -->
          <div>
            <label for="first_name" class="block text-sm font-semibold text-gray-700 mb-2">
              First Name <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                type="text"
                id="first_name"
                formControlName="first_name"
                class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                [class.border-red-500]="hasError('first_name')"
                [class.border-gray-300]="!hasError('first_name')"
                placeholder="Enter first name"
              />
              <svg *ngIf="hasError('first_name')" class="absolute right-3 top-3.5 w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <p *ngIf="getErrorMessage('first_name')" class="mt-1 text-sm text-red-600">
              {{ getErrorMessage('first_name') }}
            </p>
          </div>

          <!-- Last Name -->
          <div>
            <label for="last_name" class="block text-sm font-semibold text-gray-700 mb-2">
              Last Name <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                type="text"
                id="last_name"
                formControlName="last_name"
                class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                [class.border-red-500]="hasError('last_name')"
                [class.border-gray-300]="!hasError('last_name')"
                placeholder="Enter last name"
              />
              <svg *ngIf="hasError('last_name')" class="absolute right-3 top-3.5 w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <p *ngIf="getErrorMessage('last_name')" class="mt-1 text-sm text-red-600">
              {{ getErrorMessage('last_name') }}
            </p>
          </div>

          <!-- Username -->
          <div>
            <label for="user_name" class="block text-sm font-semibold text-gray-700 mb-2">
              Username <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <span class="absolute left-3 top-3.5 text-gray-400">@</span>
              <input
                type="text"
                id="user_name"
                formControlName="user_name"
                class="w-full pl-8 pr-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                [class.border-red-500]="hasError('user_name')"
                [class.border-gray-300]="!hasError('user_name')"
                placeholder="username"
              />
              <svg *ngIf="hasError('user_name')" class="absolute right-3 top-3.5 w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <p *ngIf="getErrorMessage('user_name')" class="mt-1 text-sm text-red-600">
              {{ getErrorMessage('user_name') }}
            </p>
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
              Email Address <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                type="email"
                id="email"
                formControlName="email"
                class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                [class.border-red-500]="hasError('email', 'email') || hasError('email')"
                [class.border-gray-300]="!hasError('email', 'email') && !hasError('email')"
                placeholder="you@example.com"
              />
              <svg *ngIf="hasError('email', 'email') || hasError('email')" class="absolute right-3 top-3.5 w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <p *ngIf="getErrorMessage('email')" class="mt-1 text-sm text-red-600">
              {{ getErrorMessage('email') }}
            </p>
          </div>

          <!-- Phone -->
          <div>
            <label for="phone" class="block text-sm font-semibold text-gray-700 mb-2">
              Phone Number
            </label>
            <input
              type="tel"
              id="phone"
              formControlName="phone"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
              placeholder="+1 (555) 000-0000"
            />
          </div>

          <!-- Date of Birth -->
          <div>
            <label for="date_of_birth" class="block text-sm font-semibold text-gray-700 mb-2">
              Date of Birth
            </label>
            <input
              type="date"
              id="date_of_birth"
              formControlName="date_of_birth"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            />
          </div>

          <!-- Gender -->
          <div>
            <label for="gender" class="block text-sm font-semibold text-gray-700 mb-2">
              Gender
            </label>
            <select
              id="gender"
              formControlName="gender"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            >
              <option value="">Select gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- City -->
          <div>
            <label for="city" class="block text-sm font-semibold text-gray-700 mb-2">
              City
            </label>
            <input
              type="text"
              id="city"
              formControlName="city"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
              placeholder="Enter city"
            />
          </div>

          <!-- State -->
          <div class="md:col-span-2">
            <label for="state" class="block text-sm font-semibold text-gray-700 mb-2">
              State / Province
            </label>
            <input
              type="text"
              id="state"
              formControlName="state"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
              placeholder="Enter state or province"
            />
          </div>

        </div>
      </div>

      <!-- Form Actions -->
      <div class="px-8 py-6 bg-gray-50 border-t border-gray-200 flex flex-col sm:flex-row justify-end space-y-3 sm:space-y-0 sm:space-x-4">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="saving"
          class="w-full sm:w-auto px-6 py-3 border border-gray-300 rounded-lg text-gray-700 font-semibold hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="saving || editForm.invalid"
          class="w-full sm:w-auto px-6 py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
        >
          <svg *ngIf="saving" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ saving ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>

    </form>

  </div>
</div>
