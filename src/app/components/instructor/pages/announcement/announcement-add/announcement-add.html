<div class="p-6 max-w-3xl mx-auto">

  <div class="flex items-center gap-4 mb-8">
    <a routerLink="/instructor/announcement/list"
      class="w-9 h-9 flex items-center justify-center rounded-lg border border-gray-200 hover:bg-gray-50 transition-all text-gray-500">
      <i class="fas fa-arrow-left text-sm"></i>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-gray-800">New Announcement</h1>
      <p class="text-gray-500 text-sm">Send an announcement to your students</p>
    </div>
  </div>

  <div *ngIf="successMsg" class="mb-5 p-4 bg-green-50 border border-green-200 rounded-xl text-green-700 text-sm font-medium flex items-center gap-2">
    <i class="fas fa-check-circle"></i> {{ successMsg }}
  </div>

  <div *ngIf="errorMsg" class="mb-5 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm font-medium flex items-center gap-2">
    <i class="fas fa-exclamation-circle"></i> {{ errorMsg }}
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 space-y-6">

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">
        Select Course <span class="text-gray-400 font-normal">(Optional)</span>
      </label>

      <div *ngIf="loadingCourses" class="flex items-center gap-2 text-gray-400 text-sm py-3 px-4 border border-dashed border-gray-200 rounded-xl">
        <i class="fas fa-spinner fa-spin"></i> Loading your courses...
      </div>

      <div *ngIf="coursesError" class="text-red-500 text-sm py-2 flex items-center gap-2">
        <i class="fas fa-exclamation-circle"></i> {{ coursesError }}
      </div>

      <select *ngIf="!loadingCourses && !coursesError"
        [(ngModel)]="form.course_id"
        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all bg-white appearance-none">
        <option [ngValue]="undefined">-- Select a specific course --</option>
        <option *ngFor="let course of courses" [value]="course.id">
          {{ course.course_code }} - {{ course.course_name }}
        </option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">
        Title <span class="text-red-500">*</span>
      </label>
      <input
        [(ngModel)]="form.title"
        type="text"
        placeholder="Enter announcement title..."
        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all"
      />
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">
        Message <span class="text-red-500">*</span>
      </label>
      <textarea
        [(ngModel)]="form.message"
        rows="6"
        placeholder="Write your announcement message here..."
        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all resize-none"
      ></textarea>
    </div>

    <div class="grid md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Priority</label>
        <select
          [(ngModel)]="form.priority"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all bg-white">
          <option value="low">🟢 Low</option>
          <option value="normal">🟡 Normal</option>
          <option value="high">🔴 High</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
        <select
          [(ngModel)]="form.status"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all bg-white">
          <option value="draft">📝 Save as Draft</option>
          <option value="sent">📤 Send Now</option>
          <option value="scheduled">🕐 Schedule</option>
        </select>
      </div>
    </div>

    <div *ngIf="form.status === 'scheduled'" class="animate-in fade-in slide-in-from-top-2 duration-300">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Schedule Date & Time</label>
      <input
        [(ngModel)]="form.scheduled_at"
        type="datetime-local"
        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#073a89] focus:border-transparent transition-all"
      />
    </div>

    <div *ngIf="form.status === 'sent'" class="p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-700 text-sm flex items-start gap-2">
      <i class="fas fa-info-circle mt-0.5 shrink-0"></i>
      <span>Selecting <strong>Send Now</strong> will immediately email <strong>all students currently enrolled</strong> in your {{ form.course_id ? 'selected course' : 'courses' }}.</span>
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-50">
      <a routerLink="/instructor/announcement/list"
        class="px-5 py-2.5 border border-gray-200 text-gray-600 rounded-xl font-semibold text-sm hover:bg-gray-50 transition-all">
        Cancel
      </a>
      <button
        (click)="submit()"
        [disabled]="submitting"
        class="px-6 py-2.5 bg-[#073a89] text-white rounded-xl font-semibold text-sm hover:bg-blue-900 transition-all disabled:opacity-60 flex items-center gap-2">
        <i *ngIf="submitting" class="fas fa-spinner fa-spin"></i>
        <i *ngIf="!submitting && form.status === 'sent'" class="fas fa-paper-plane"></i>
        <i *ngIf="!submitting && form.status !== 'sent'" class="fas fa-save"></i>
        {{ submitting ? 'Processing...' : (form.status === 'sent' ? 'Send Announcement' : 'Save Announcement') }}
      </button>
    </div>

  </div>
</div>
