<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Edit Assignment</h1>
      <p class="text-gray-600 mt-1">Update your assignment details</p>
    </div>
    <a routerLink="/instructor/assignment/list"
      class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 flex items-center gap-2 text-sm font-medium">
      <i class="fas fa-arrow-left"></i> Back
    </a>
  </div>
</div>

<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading...</p>
</div>

<div *ngIf="!isLoading" class="bg-white rounded-lg border border-gray-200 p-6">
  <form [formGroup]="assignmentForm" (ngSubmit)="onSubmit()" class="space-y-6">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Course <span class="text-red-500">*</span></label>
      <select formControlName="course_id" (change)="onCourseChange()"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
        <option value="" disabled>Select Course</option>
        <option *ngFor="let course of courses" [value]="course.id">{{ course.course_name }}</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Batch <span class="text-red-500">*</span></label>
      <div *ngIf="loadingBatches" class="text-sm text-gray-500">
        <i class="fas fa-spinner fa-spin mr-1"></i> Loading batches...
      </div>
      <select *ngIf="!loadingBatches" formControlName="batch_id"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
        <option value="" disabled>Select Batch</option>
        <option *ngFor="let batch of batches" [value]="batch.id">{{ batch.name }}</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Title <span class="text-red-500">*</span></label>
      <input type="text" formControlName="title"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Assignment File</label>
      <input type="file" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx,.ppt,.pptx"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm">
      <p class="text-xs text-gray-500 mt-1">Leave empty to keep existing file. Allowed: PDF, DOC, DOCX, PPT</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Upload Date</label>
      <input formControlName="start_date" type="date"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Due Date <span class="text-red-500">*</span></label>
      <input type="date" formControlName="due_date"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Total Marks</label>
      <input type="number" formControlName="total_marks"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
      <textarea formControlName="description" rows="4"
        class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Active Status</label>
      <select formControlName="active_status"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>

    <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
      <button type="button" (click)="goToList()"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
        Cancel
      </button>
      <button type="submit" [disabled]="assignmentForm.invalid || isSubmitting"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm font-medium flex items-center gap-2">
        <span *ngIf="isSubmitting" class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
        {{ isSubmitting ? 'Saving...' : 'Update Assignment' }}
      </button>
    </div>

  </form>
</div>
