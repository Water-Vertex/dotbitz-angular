<div class="space-y-6">

  <!-- Header -->
  <div class="bg-white rounded-xl border border-gray-200 p-6 flex justify-between items-center shadow-sm">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">My MCQs</h1>
      <p class="text-gray-500 mt-1 text-sm">Manage MCQs for your courses</p>
    </div>
    <div class="flex items-center gap-2">
      <button (click)="loadMcqs()" [disabled]="loading"
        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 flex items-center text-sm font-medium disabled:opacity-50">
        <i class="fas fa-sync-alt mr-2" [class.animate-spin]="loading"></i>
        {{ loading ? 'Refreshing...' : 'Refresh' }}
      </button>
      <a routerLink="/instructor/mcqs/add"
        class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Add MCQ
      </a>
    </div>
  </div>
<select
  [(ngModel)]="selectedCourseId"
  (change)="filterByCourse()"
  class="px-3 py-2 border border-gray-300 rounded-md text-sm">
  
  <option [ngValue]="null">All Courses</option>

  <option *ngFor="let c of courses" [ngValue]="c.id">
    {{ c.course_name }}
  </option>
</select>
  <!-- Loading -->
  <div *ngIf="loading" class="bg-white rounded-xl border border-gray-200 p-12 text-center shadow-sm">
    <i class="bi bi-arrow-repeat animate-spin text-2xl text-blue-600"></i>
    <p class="text-gray-500 mt-2 text-sm">Loading MCQs...</p>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && mcqs.length === 0"
    class="bg-white rounded-xl border border-gray-200 p-12 text-center shadow-sm">
    <i class="bi bi-question-circle text-4xl text-gray-300"></i>
    <p class="text-gray-500 mt-2">No MCQs found.</p>
    <a routerLink="/instructor/mcqs/add"
      class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Add First MCQ
    </a>
  </div>

  <!-- Table -->
  <div *ngIf="!loading && mcqs.length > 0"
    class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">#</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Question</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Answer</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let mcq of mcqs; let i = index" class="hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 text-gray-500">{{ i + 1 }}</td>
          <td class="px-6 py-4 font-medium text-gray-900 max-w-xs truncate">{{ mcq.question }}</td>
          <td class="px-6 py-4 text-gray-600 max-w-xs truncate">{{ mcq.answer }}</td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 rounded-full text-xs font-medium"
              [ngClass]="mcq.issingle ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'">
              {{ mcq.issingle ? 'Single' : 'Multiple' }}
            </span>
          </td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 rounded-full text-xs font-medium"
              [ngClass]="mcq.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
              {{ mcq.status | titlecase }}
            </span>
          </td>
          <td class="px-6 py-4">
            <div class="flex items-center gap-2">
              <button (click)="onEdit(mcq.msq_id)"
                class="px-3 py-1 bg-blue-50 text-blue-600 border border-blue-200 rounded-lg hover:bg-blue-100 text-xs font-medium">
                <i class="bi bi-pencil mr-1"></i> Edit
              </button>
              <button (click)="onDelete(mcq.msq_id)" [disabled]="deleting === mcq.msq_id"
                class="px-3 py-1 bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100 text-xs font-medium disabled:opacity-50">
                <i class="bi bi-trash mr-1"></i>
                {{ deleting === mcq.msq_id ? 'Deleting...' : 'Delete' }}
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
