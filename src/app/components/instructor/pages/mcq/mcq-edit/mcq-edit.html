<div class="space-y-6">

  <!-- Header -->
  <div class="bg-white rounded-lg border border-gray-200 p-6 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Edit MCQ</h1>
      <p class="text-gray-600 mt-1">Update the multiple choice question</p>
    </div>
    <a routerLink="/instructor/mcqs" class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 transition-colors flex items-center space-x-2 text-sm font-medium">
      <i class="bi bi-arrow-left"></i>
      <span>Back to List</span>
    </a>
  </div>

  <!-- Form Card -->
  <div class="bg-white rounded-lg border border-gray-200 p-6">
    <form [formGroup]="mcqForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Course -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Course <span class="text-red-500">*</span>
        </label>
        <div *ngIf="coursesLoading" class="flex items-center space-x-2 text-orange-600">
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-orange-600"></div>
          <span>Loading courses...</span>
        </div>
        <select formControlName="course_id"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
          [disabled]="coursesLoading || courses.length === 0">
          <option value="">-- Select Course --</option>
          <option *ngFor="let course of courses" [value]="course.id">
            {{ course.course_name }} <span *ngIf="course.course_code">({{ course.course_code }})</span>
          </option>
        </select>
      </div>

      <!-- Question -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Question <span class="text-red-500">*</span>
        </label>
        <textarea formControlName="question" rows="4"
          placeholder="Enter your question here..."
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
          [class.border-red-300]="mcqForm.get('question')?.invalid && mcqForm.get('question')?.touched"></textarea>
        <small class="text-gray-500">Write a clear and concise question</small>
      </div>

      <!-- Answer -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Correct Answer <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="answer"
          placeholder="Type correct answer(s), separate multiple answers with commas"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
      <p *ngIf="answerError" class="mt-1 text-xs text-red-600 flex items-center gap-1">
  <i class="bi bi-exclamation-circle"></i>
  Answer must match one of the options above.
</p>

        </div>
        <!-- Marks -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-2">
    Marks <span class="text-red-500">*</span>
  </label>
  <input type="number" formControlName="marks" min="1"
    placeholder="e.g. 2"
    class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
</div>

      <!-- Answer Type -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Answer Type <span class="text-red-500">*</span>
        </label>
        <div class="flex space-x-4 text-sm">
          <label class="flex items-center gap-2 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 cursor-pointer hover:bg-gray-100">
            <input type="radio" formControlName="issingle" [value]="true">
            Single Answer
          </label>
          <label class="flex items-center gap-2 bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 cursor-pointer hover:bg-gray-100">
            <input type="radio" formControlName="issingle" [value]="false">
            Multiple Answers
          </label>
        </div>
      </div>

      <!-- Options -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-sm font-medium text-gray-700">
            Options <span class="text-red-500">*</span>
            <small class="text-gray-500 ml-2">(Minimum 2 required)</small>
          </label>
          <button type="button" (click)="addOption()"
            class="px-3 py-1 bg-green-600 text-white rounded-md hover:bg-green-700 text-sm flex items-center space-x-1"
            [disabled]="options.length >= 10">
            <i class="bi bi-plus-circle"></i>
            <span>Add Option</span>
          </button>
        </div>

        <div formArrayName="options" class="space-y-2">
          <div *ngFor="let option of options.controls; let i = index" [formGroupName]="i"
            class="flex items-center gap-3">

            <span class="w-7 h-7 flex items-center justify-center rounded-full bg-orange-100 text-orange-700 text-xs font-semibold">
              {{ i + 1 }}
            </span>

            <input type="text" formControlName="value" placeholder="Option {{ i + 1 }}"
              class="flex-1 px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">

            <button type="button" (click)="removeOption(i)" [disabled]="options.length <= 2"
              class="flex items-center gap-1 px-2 py-1 text-red-600 border border-red-200 rounded-md hover:bg-red-100 hover:text-red-700 text-sm disabled:opacity-40">
              <i class="bi bi-x-circle"></i> Remove
            </button>
          </div>
        </div>
      </div>

      <!-- Status -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
        <select formControlName="status"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>

      <!-- Form Actions -->
      <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
        <a routerLink="/instructor/mcqs/list"
          class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center space-x-2">
          <i class="bi bi-x"></i>
          <span>Cancel</span>
        </a>
        <button type="submit" [disabled]="mcqForm.invalid || loading"
          class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 transition-colors flex items-center space-x-2 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!loading" class="flex items-center space-x-2">
            <i class="bi bi-check-circle"></i>
            <span>Update MCQ</span>
          </span>
          <span *ngIf="loading" class="flex items-center space-x-2">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
            <span>Saving...</span>
          </span>
        </button>
      </div>

    </form>
  </div>
</div>
