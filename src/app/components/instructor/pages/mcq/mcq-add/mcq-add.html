<div class="space-y-8">

  <!-- Header -->
  <div class="bg-white rounded-xl border border-gray-200 p-6 flex justify-between items-center shadow-sm">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Add New MCQs</h1>
      <p class="text-gray-500 mt-1 text-sm">Create multiple questions for a single course</p>
    </div>

    <a
      routerLink="/instructor/mcqs"
      class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-transform transform hover:scale-105 cursor-pointer text-sm font-medium">
      <i class="bi bi-arrow-left"></i>
      Back to list
    </a>
  </div>

  <!-- Form -->
  <form [formGroup]="mcqForm" (ngSubmit)="onSubmit()" class="bg-white rounded-xl border border-gray-200 p-6 space-y-8 shadow-sm">

    <!-- Course -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Course <span class="text-red-500">*</span>
      </label>

      <select
        formControlName="course_id"
        class="w-full px-4 py-2 border rounded-lg bg-gray-50 text-sm border-gray-300 
               focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 shadow-sm 
               transition-colors duration-200"
        [disabled]="coursesLoading || courses.length === 0">
        <option value="">Select Course</option>
        <option *ngFor="let course of courses" [value]="course.id">
          {{ course.course_name }} ({{ course.course_code }})
        </option>
      </select>
    </div>

    <!-- MCQs -->
    <div formArrayName="mcqs" class="space-y-8">
      <div
        *ngFor="let mcq of mcqs.controls; let i = index"
        [formGroupName]="i"
        class="border rounded-xl p-6 bg-gray-50 space-y-6 shadow-sm">

        <!-- MCQ Header -->
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-semibold text-gray-800">MCQ {{ i + 1 }}</h2>

          <button
            *ngIf="mcqs.length > 1"
            type="button"
            (click)="removeMcq(i)"
            class="text-red-600 hover:text-red-700 flex items-center gap-1 cursor-pointer text-sm transition-transform hover:scale-110">
            <i class="bi bi-trash"></i> Remove
          </button>
        </div>

        <!-- Question -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Question</label>
          <textarea
            formControlName="question"
            rows="3"
            placeholder="Write the question here..."
            class="w-full px-4 py-2 border rounded-lg text-sm border-gray-300 
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 
                   shadow-sm transition-colors duration-200"></textarea>
        </div>

        <!-- Answer -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Correct Answer</label>
          <input
            type="text"
            formControlName="answer"
            placeholder="Type correct answer(s), separate multiple answers with commas"
            class="w-full px-4 py-2 border rounded-lg text-sm border-gray-300 
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 
                   shadow-sm transition-colors duration-200">
        </div>

        <!-- Answer Type -->
        <div class="flex gap-6 text-sm">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" formControlName="issingle" [value]="true">
            Single Answer
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" formControlName="issingle" [value]="false">
            Multiple Answers
          </label>
        </div>

        <!-- Options -->
        <div formArrayName="options" class="space-y-3">
          <label class="block text-sm font-medium text-gray-700">Options</label>

          <div
            *ngFor="let opt of optionsAt(i).controls; let j = index"
            [formGroupName]="j"
            class="flex items-center gap-3">

            <span class="w-7 h-7 flex items-center justify-center rounded-full bg-blue-100 text-blue-700 text-xs font-semibold">
              {{ j + 1 }}
            </span>

            <input
              type="text"
              formControlName="value"
              placeholder="Option text"
              class="flex-1 px-4 py-2 border rounded-lg text-sm border-gray-300 
                     focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 
                     shadow-sm transition-colors duration-200">

            <button
              type="button"
              (click)="removeOption(i,j)"
              [disabled]="optionsAt(i).length <= 2"
              class="flex items-center gap-1 px-2 py-1 text-red-600 border border-red-200 rounded-md 
                     hover:bg-red-100 hover:text-red-700 transition-transform hover:scale-110 cursor-pointer text-sm">
              <i class="bi bi-x-circle"></i> Remove
            </button>

          </div>

          <button
            type="button"
            (click)="addOption(i)"
            [disabled]="optionsAt(i).length >= 10"
            class="inline-flex items-center gap-2 text-green-600 hover:text-green-700 cursor-pointer transition-transform hover:scale-110 text-sm">
            <i class="bi bi-plus-circle"></i> Add Option
          </button>
        </div>

        <!-- Status -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <select formControlName="status" class="px-4 py-2 border rounded-lg text-sm bg-white border-gray-300 shadow-sm 
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-colors duration-200">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

      </div>
    </div>

    <!-- Add MCQ -->
    <button
      type="button"
      (click)="addMcq()"
      class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-700 cursor-pointer transition-transform hover:scale-110 text-sm">
      <i class="bi bi-plus-circle"></i> Add Another MCQ
    </button>

    <!-- Footer -->
    <div class="flex justify-end gap-3 pt-6 border-t">
      <a
        routerLink="/instructor/mcqs"
        class="px-4 py-2 border rounded-lg text-sm hover:bg-gray-50 cursor-pointer transition-transform hover:scale-105">
        Cancel
      </a>

      <button
        type="submit"
        [disabled]="mcqForm.invalid || loading"
        class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 transition-transform hover:scale-105">
        {{ loading ? 'Saving…' : 'Create MCQs' }}
      </button>
    </div>

  </form>
</div>
