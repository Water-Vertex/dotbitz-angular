<div class="space-y-6">

  <!-- Header -->
  <div class="bg-white rounded-xl border border-gray-200 p-6 flex items-center justify-between shadow-sm">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Events</h1>
      <p class="text-gray-500 mt-1 text-sm">Upcoming events and activities</p>
    </div>
    <button (click)="loadEvents()" [disabled]="loading"
      class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center
             gap-2 text-sm font-medium disabled:opacity-50">
      <i class="fas fa-sync-alt" [class.animate-spin]="loading"></i>
      Refresh
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="bg-white rounded-xl border border-gray-200 p-12 text-center shadow-sm">
    <div class="animate-spin rounded-full h-8 w-8 border-2 border-gray-200 border-t-[#073a89] mx-auto"></div>
    <p class="text-gray-500 mt-2 text-sm">Loading events...</p>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && events.length === 0"
    class="bg-white rounded-xl border border-gray-200 p-12 text-center shadow-sm">
    <i class="fas fa-calendar-alt text-4xl text-gray-300 mb-3 block"></i>
    <p class="text-gray-500">No upcoming events at the moment.</p>
  </div>

  <!-- Events Grid -->
  <div *ngIf="!loading && events.length > 0"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

    <div *ngFor="let event of events"
      class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm
             hover:shadow-md hover:border-[#073a89]/30 transition-all">

      <!-- Image -->
      <div class="relative aspect-[16/9] bg-gradient-to-br from-[#073a89]/10 to-blue-50 overflow-hidden">
        <img *ngIf="event.image" [src]="event.image" [alt]="event.name"
          class="w-full h-full object-cover">
        <div *ngIf="!event.image"
          class="w-full h-full flex items-center justify-center">
          <i class="fas fa-calendar-alt text-4xl text-[#073a89]/30"></i>
        </div>

        <!-- Upcoming badge -->
        <div *ngIf="isUpcoming(event.date)"
          class="absolute top-3 left-3 px-2 py-1 bg-green-500 text-white text-xs
                 font-semibold rounded-full">
          Upcoming
        </div>
      </div>

      <!-- Content -->
      <div class="p-5">

        <h3 class="font-bold text-gray-900 text-base mb-2 line-clamp-2">
          {{ event.name }}
        </h3>

        <!-- Meta -->
        <div class="space-y-2 mb-4">
          <div class="flex items-center gap-2 text-sm text-gray-600">
            <i class="fas fa-calendar text-[#073a89] w-4"></i>
            <span>{{ event.date_display }}</span>
          </div>
          <div class="flex items-center gap-2 text-sm text-gray-600">
            <i class="fas fa-clock text-[#073a89] w-4"></i>
            <span>
              {{ event.start_time_display }}
              <span *ngIf="event.end_time_display" class="text-gray-400">
                — {{ event.end_time_display }}
              </span>
            </span>
          </div>
          <div *ngIf="event.location" class="flex items-center gap-2 text-sm text-gray-600">
            <i class="fas fa-map-marker-alt text-[#073a89] w-4"></i>
            <span class="line-clamp-1">{{ event.location }}</span>
          </div>
        </div>

        <p *ngIf="event.description"
          class="text-sm text-gray-500 line-clamp-2 mb-4">
          {{ event.description }}
        </p>

        <!-- Add to Calendar Button -->
        <button (click)="addToCalendar(event)"
          class="w-full flex items-center justify-center gap-2 px-4 py-2.5
                 bg-[#073a89] text-white rounded-lg text-sm font-medium
                 hover:bg-[#052b63] transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
          </svg>
          Add to Google Calendar
        </button>

      </div>
    </div>

  </div>

</div>
