<div class="space-y-6">

  <div class="bg-white rounded-xl border border-gray-200 p-6 flex justify-between items-center shadow-sm">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Add New Quiz</h1>
      <p class="text-gray-500 mt-1 text-sm">Create a quiz from your course MCQs</p>
    </div>
    <a routerLink="/instructor/quiz/list"
      class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">
      <i class="bi bi-arrow-left"></i> Back to List
    </a>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-6">

    <!-- Course -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Course <span class="text-red-500">*</span>
      </label>
      <select [(ngModel)]="selectedCourseId" (change)="onCourseChange()"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option [ngValue]="null">-- Select Course --</option>
        <option *ngFor="let course of courses" [value]="course.id">{{ course.course_name }}</option>
      </select>
    </div>

    <!-- Batch -->
    <div *ngIf="selectedCourseId">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Batch <span class="text-red-500">*</span>
      </label>
      <div *ngIf="loadingBatches" class="text-sm text-gray-500">
        <i class="bi bi-arrow-repeat animate-spin"></i> Loading batches...
      </div>
      <select *ngIf="!loadingBatches" [(ngModel)]="selectedBatchId"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option [ngValue]="null">-- Select Batch --</option>
        <option *ngFor="let batch of batches" [value]="batch.id">{{ batch.name }}</option>
      </select>
    </div>

    <!-- Quiz Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Quiz Name <span class="text-red-500">*</span>
      </label>
      <input type="text" [(ngModel)]="name" placeholder="Enter quiz name"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Marks + Duration -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Total Marks <span class="text-red-500">*</span></label>
        <input type="number" [(ngModel)]="marks" placeholder="e.g. 20"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Duration (minutes) <span class="text-red-500">*</span></label>
        <input type="number" [(ngModel)]="duration" placeholder="e.g. 30"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>

    <!-- Due Date + Status -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Due Date <span class="text-red-500">*</span></label>
        <input type="datetime-local" [(ngModel)]="dueDate"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
        <select [(ngModel)]="status"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="draft">Draft</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </div>

    <!-- MCQs -->
    <div *ngIf="selectedCourseId">
      <label class="block text-sm font-medium text-gray-700 mb-3">
        Select MCQs <span class="text-red-500">*</span>
        <span class="ml-2 text-xs text-blue-600 font-normal">({{ selectedMcqIds.length }} selected)</span>
      </label>
      <div *ngIf="loadingMcqs" class="text-sm text-gray-500">
        <i class="bi bi-arrow-repeat animate-spin"></i> Loading MCQs...
      </div>
      <div *ngIf="!loadingMcqs && mcqs.length === 0" class="text-sm text-gray-400">
        No MCQs found for this course.
      </div>
      <div *ngIf="!loadingMcqs && mcqs.length > 0"
        class="space-y-3 max-h-96 overflow-y-auto border border-gray-200 rounded-xl p-4">
        <div *ngFor="let mcq of mcqs; let i = index"
          class="flex items-start gap-3 p-3 rounded-lg hover:bg-gray-50 border border-gray-100 transition-all"
          [class.bg-blue-50]="isMcqSelected(mcq.msq_id)"
          [class.border-blue-200]="isMcqSelected(mcq.msq_id)">
          <input type="checkbox"
            [checked]="isMcqSelected(mcq.msq_id)"
            (change)="onMcqToggle(mcq.msq_id, $event)"
            class="mt-1 w-4 h-4 text-blue-600 cursor-pointer">
          <div class="flex-1">
            <p class="text-sm font-medium text-gray-800">{{ i + 1 }}. {{ mcq.question }}</p>
            <div class="flex flex-wrap gap-2 mt-2">
              <span *ngFor="let opt of mcq.options"
                class="text-xs px-2 py-0.5 bg-gray-100 text-gray-600 rounded-full">{{ opt }}</span>
            </div>
            <p class="text-xs text-green-600 mt-1">
              <i class="bi bi-check-circle mr-1"></i>Answer: {{ mcq.answer }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Submit -->
    <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
      <a routerLink="/instructor/quiz/list"
        class="px-4 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50">Cancel</a>
      <button (click)="onSubmit()" [disabled]="submitting"
        class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 disabled:opacity-60">
        {{ submitting ? 'Saving...' : 'Create Quiz' }}
      </button>
    </div>

  </div>
</div>
