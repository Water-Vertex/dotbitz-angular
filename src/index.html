<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DotbitzAngular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
   <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @keyframes slide-in {
  from {
    transform: translateX(100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

.animate-slide-in {
  animation: slide-in 0.3s ease-out;
}
    </style>
</head>
<body>
  
  <app-root></app-root>
   <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
   <script>
    $(document).ready(function() {
        // Mobile sidebar toggle
        $('#mobileMenuBtn').on('click', function() {
            $('.sidebar-mobile').addClass('active');
            $('#mobileOverlay').addClass('active');
            $('body').css('overflow', 'hidden');
        });
        
        $('.close-sidebar, #mobileOverlay').on('click', function() {
            $('.sidebar-mobile').removeClass('active');
            $('#mobileOverlay').removeClass('active');
            $('body').css('overflow', 'auto');
        });
        
        // Close sidebar when clicking a nav item on mobile
        $('.sidebar-mobile [data-nav-item]').on('click', function() {
            setTimeout(function() {
                $('.sidebar-mobile').removeClass('active');
                $('#mobileOverlay').removeClass('active');
                $('body').css('overflow', 'auto');
            }, 300);
        });
        
        // Desktop user menu toggle
        $('.user-menu-btn').on('click', function(e) {
            e.stopPropagation();
            const $dropdown = $(this).closest('.desktop-user-menu').find('.user-dropdown');
            $dropdown.toggle();
        });
        
        // Close desktop dropdown when clicking elsewhere
        $(document).on('click', function(e) {
            if (!$(e.target).closest('.desktop-user-menu').length) {
                $('.user-dropdown').hide();
            }
        });
        
        // Mobile user menu toggle
        $('#mobileUserBtn').on('click', function(e) {
            e.stopPropagation();
            $('#mobileUserDropdown').toggleClass('active');
            $('#mobileOverlay').toggleClass('active');
        });
        
        // Close mobile user dropdown
        $(document).on('click', function(e) {
            if (!$(e.target).closest('#mobileUserBtn').length && !$(e.target).closest('#mobileUserDropdown').length) {
                $('#mobileUserDropdown').removeClass('active');
                $('#mobileOverlay').removeClass('active');
            }
        });
        
        // Mobile search button functionality
        $('.mobile-search-btn').on('click', function() {
            const searchTerm = prompt('Enter search term:');
            if (searchTerm) {
                console.log('Searching for:', searchTerm);
            }
        });
        
        // Update active nav items on navigation
        function updateActiveNavItems() {
            const currentUrl = window.location.href;
            
            $('[data-nav-item]').each(function() {
                const $item = $(this);
                const href = $item.attr('data-href');
                const isActive = currentUrl === href || currentUrl.startsWith(href);
                
                if (isActive) {
                    $item
                        .addClass('bg-blue-50 text-blue-600 border-l-4 border-blue-500')
                        .removeClass('text-gray-700 hover:bg-blue-50 border-transparent');
                    
                    const $iconContainer = $item.find('div.w-8.h-8');
                    if ($iconContainer.length) {
                        $iconContainer
                            .removeClass('bg-blue-100 group-hover:bg-blue-200')
                            .addClass('bg-blue-200');
                        
                        const $icon = $iconContainer.find('i');
                        if ($icon.length) {
                            $icon.addClass('text-blue-700');
                        }
                    }
                } else {
                    $item
                        .removeClass('bg-blue-50 text-blue-600 border-l-4 border-blue-500')
                        .addClass('text-gray-700 hover:bg-blue-50 border-transparent');
                    
                    const $iconContainer = $item.find('div.w-8.h-8');
                    if ($iconContainer.length) {
                        const isFAQ = $item.attr('data-href') === '/admin/faq/list';
                        
                        if (isFAQ) {
                            $iconContainer
                                .removeClass('bg-blue-200')
                                .addClass('bg-green-100 group-hover:bg-green-200');
                            
                            const $icon = $iconContainer.find('i');
                            if ($icon.length) {
                                $icon
                                    .removeClass('text-blue-700')
                                    .addClass('text-green-600');
                            }
                        } else {
                            $iconContainer
                                .removeClass('bg-blue-200')
                                .addClass('bg-blue-100 group-hover:bg-blue-200');
                            
                            const $icon = $iconContainer.find('i');
                            if ($icon.length) {
                                $icon
                                    .removeClass('text-blue-700')
                                    .addClass('text-blue-600');
                            }
                        }
                    }
                }
            });
        }
        
        // Initialize active nav items
        updateActiveNavItems();
        
        // Update active nav items on URL change (for single page applications)
        if (typeof history !== 'undefined' && history.pushState) {
            $(window).on('popstate', updateActiveNavItems);
            
            const originalPushState = history.pushState;
            history.pushState = function(state, title, url) {
                originalPushState.call(history, state, title, url);
                setTimeout(updateActiveNavItems, 50);
            };
        }
        
        // Update active nav items when clicking on anchor links
        $(document).on('click', 'a[href^="/"]', function(e) {
            if (!$(this).attr('target') && this.hostname === window.location.hostname) {
                setTimeout(updateActiveNavItems, 100);
            }
        });
        
        // Handle window resize
        $(window).on('resize', function() {
            if ($(window).width() >= 1024) {
                $('.sidebar-mobile').removeClass('active');
                $('#mobileOverlay').removeClass('active');
                $('body').css('overflow', 'auto');
            }
        });
        
        // Close dropdowns on escape key
        $(document).on('keydown', function(e) {
            if (e.key === 'Escape') {
                $('.user-dropdown').hide();
                $('#mobileUserDropdown').removeClass('active');
                $('#mobileOverlay').removeClass('active');
                $('.sidebar-mobile').removeClass('active');
                $('body').css('overflow', 'auto');
            }
        });
        
        // Prevent body scroll when sidebar is open
        $(document).on('touchmove', function(e) {
            if ($('.sidebar-mobile').hasClass('active')) {
                e.preventDefault();
            }
        });
        
        // Handle mobile viewport height
        function setViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        
        setViewportHeight();
        $(window).on('resize', setViewportHeight);
    });
</script>
</body>
</html>
